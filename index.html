<script type="module">
import * as THREE from 'three';

/* =========================================================
   UTILS
   ========================================================= */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function chunkSeed(cx, cz) {
  let h = Math.imul(cx, 374761393) + Math.imul(cz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* =========================================================
   NOISE
   ========================================================= */
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y, oct) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * freq, y * freq);
    norm += amp; amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}

/* =========================================================
   STRAIGHT ROAD GRID + TERRAIN FLATTENING
   ========================================================= */
const ROAD_SPACING   = 900;
const ROAD_WIDTH     = 32;
const ROAD_HALF_W    = ROAD_WIDTH * 0.5;
const ROAD_FLAT_HALF = ROAD_WIDTH * 0.75;  // terrain fully flat
const ROAD_BLEND_HALF= ROAD_WIDTH * 2.0;   // blend out to full terrain
const ROAD_TARGET_H  = 6;

function baseHeight(x, z) {
  const base = fbm(x * 0.0016, z * 0.0016, 5);
  let h = (base - 0.45) * 340;
  const lake = fbm(x * 0.00075 + 137.3, z * 0.00075 + 91.7, 3);
  if (lake < 0.44) {
    const t = Math.min(1, (0.44 - lake) / 0.16);
    h = h * (1 - t) - 58 * t;
  }
  const mn = fbm(x * 0.00055 + 512.1, z * 0.00055 + 733.9, 4);
  let mask = (mn - 0.53) / 0.47;
  if (mask > 0) {
    mask = Math.min(1, mask);
    const ridge = fbm(x * 0.0034 + 77.7, z * 0.0034 + 21.3, 4);
    h += mask * mask * (650 + 950 * ridge * ridge);
  }
  return h;
}

function roadInfluence(x, z) {
  const kx = Math.round(x / ROAD_SPACING);
  const distX = Math.abs(x - kx * ROAD_SPACING);
  const kz = Math.round(z / ROAD_SPACING);
  const distZ = Math.abs(z - kz * ROAD_SPACING);

  let infl = 0;
  if (distX < ROAD_BLEND_HALF) {
    infl = distX < ROAD_FLAT_HALF ? 1
         : 1 - (distX - ROAD_FLAT_HALF) / (ROAD_BLEND_HALF - ROAD_FLAT_HALF);
  }
  if (distZ < ROAD_BLEND_HALF) {
    const i2 = distZ < ROAD_FLAT_HALF ? 1
             : 1 - (distZ - ROAD_FLAT_HALF) / (ROAD_BLEND_HALF - ROAD_FLAT_HALF);
    if (i2 > infl) infl = i2;
  }
  return infl;
}

function terrainHeight(x, z) {
  let h = baseHeight(x, z);
  const infl = roadInfluence(x, z);
  if (infl > 0 && h < ROAD_TARGET_H + 30) {
    h = h * (1 - infl) + ROAD_TARGET_H * infl;
  }
  return h;
}

function isOnRoad(x, z) {
  const kx = Math.round(x / ROAD_SPACING);
  if (Math.abs(x - kx * ROAD_SPACING) < ROAD_HALF_W + 1.5) return true;
  const kz = Math.round(z / ROAD_SPACING);
  if (Math.abs(z - kz * ROAD_SPACING) < ROAD_HALF_W + 1.5) return true;
  return false;
}

/* =========================================================
   PALETTE
   ========================================================= */
const C_MUD    = new THREE.Color(0x3e5a4a);
const C_SAND   = new THREE.Color(0xd9c98d);
const C_GRASS1 = new THREE.Color(0x74bd4e);
const C_GRASS2 = new THREE.Color(0x4f9539);
const C_FOREST = new THREE.Color(0x36702d);
const C_ROCK   = new THREE.Color(0x7a7166);
const C_ROCK2  = new THREE.Color(0x585250);
const C_SNOW   = new THREE.Color(0xeef5ff);

function pickColor(y, ny, out) {
  if (y < -2)          out.copy(C_MUD);
  else if (y < 4)      out.copy(C_SAND);
  else if (ny < 0.62)  out.copy(C_ROCK);
  else if (y < 170)    out.copy(C_GRASS1).lerp(C_GRASS2, (y - 4) / 166);
  else if (y < 340)    out.copy(C_GRASS2).lerp(C_FOREST, (y - 170) / 170);
  else if (y < 520)    out.copy(C_FOREST).lerp(C_ROCK,   (y - 340) / 180);
  else if (y < 700)    out.copy(C_ROCK).lerp(C_ROCK2,    (y - 520) / 180);
  else                 out.copy(C_SNOW);
  const v = 0.93 + Math.random() * 0.14;
  out.r *= v; out.g *= v; out.b *= v;
}

/* =========================================================
   RENDERER / SCENE / SKY / LIGHTS
   ========================================================= */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xc0dcf0);
scene.fog = new THREE.Fog(FOG_COLOR, 900, 2700);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.6, 9000);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x1d5aa6) },
    midColor: { value: new THREE.Color(0xc0dcf0) },
    botColor: { value: new THREE.Color(0x94bcd8) },
    exponent: { value: 0.7 }
  },
  vertexShader: `
    varying vec3 vW;
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.0);
      vW = wp.xyz - cameraPosition;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 topColor, midColor, botColor;
    uniform float exponent;
    varying vec3 vW;
    void main(){
      float h = normalize(vW).y;
      vec3 c;
      if (h > 0.0) c = mix(midColor, topColor, pow(h, exponent));
      else         c = mix(midColor, botColor, pow(-h, 0.55));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(6000, 24, 16), skyMat);
skyMesh.renderOrder = -1000; skyMesh.frustumCulled = false;
scene.add(skyMesh);

const sunDir = new THREE.Vector3(0.35, 0.58, 0.74).normalize();
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x4a6440, 0.95));
const sun = new THREE.DirectionalLight(0xfff4dc, 1.55);
sun.position.copy(sunDir).multiplyScalar(1500);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9dc4ff, 0.4);
fill.position.set(-0.5, 0.35, -0.8).multiplyScalar(1000);
scene.add(fill);

function makeGlowTexture(inner, mid, outer) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0,    inner);
  grd.addColorStop(0.35, mid);
  grd.addColorStop(1,    outer);
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture('rgba(255,255,245,1)', 'rgba(255,220,150,0.55)', 'rgba(255,160,60,0)'),
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, transparent: true
}));
sunSprite.scale.setScalar(2400);
sunSprite.renderOrder = -900;
scene.add(sunSprite);

const engineGlowTex = makeGlowTexture('rgba(200,245,255,1)', 'rgba(110,220,255,0.6)', 'rgba(50,150,255,0)');

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(26000, 26000, 1, 1),
  new THREE.MeshPhongMaterial({
    color: 0x2a7fb5, specular: 0xcfe8ff, shininess: 120,
    transparent: true, opacity: 0.88, flatShading: true
  })
);
water.rotation.x = -Math.PI / 2;
scene.add(water);

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
const _tmpColor = new THREE.Color();
function setColor(geo, hex, variance, rng) {
  _tmpColor.set(hex);
  const v = 1 + (rng() - 0.5) * variance * 2;
  const r = _tmpColor.r * v, g = _tmpColor.g * v, b = _tmpColor.b * v;
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i*3] = r; arr[i*3+1] = g; arr[i*3+2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
function mergeGeos(geos) {
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}

/* =========================================================
   TREES (improved)
   ========================================================= */
function addPine(geos, x, y, z, s, rng) {
  const trunkH = 4.5 * s;
  const trunk = new THREE.CylinderGeometry(0.5 * s, 0.85 * s, trunkH, 5).toNonIndexed();
  setColor(trunk, 0x4a3520, 0.12, rng);
  trunk.translate(x, y + trunkH / 2, z);
  geos.push(trunk);

  const greens = [0x2d6e34, 0x2a6230, 0x24582a];
  let stack = trunkH;
  for (let i = 0; i < 3; i++) {
    const ch = 5.8 * s * (1 - i * 0.18);
    const cr = (4.2 - i * 0.95) * s;
    const c = new THREE.ConeGeometry(cr, ch, 6).toNonIndexed();
    setColor(c, greens[i], 0.10, rng);
    c.translate(x, y + stack + ch / 2 - 1.3, z);
    geos.push(c);
    stack += ch * 0.55;
  }
}

function addOak(geos, x, y, z, s, rng) {
  const trunkH = 5.2 * s;
  const trunk = new THREE.CylinderGeometry(0.9 * s, 1.6 * s, trunkH, 5).toNonIndexed();
  setColor(trunk, 0x5a4530, 0.10, rng);
  trunk.translate(x, y + trunkH / 2, z);
  geos.push(trunk);

  const nB = 3 + Math.floor(rng() * 2);
  const greens = [0x3d8a37, 0x357a30, 0x42862e];
  for (let i = 0; i < nB; i++) {
    const br = (3.8 + rng() * 2.4) * s;
    const ball = new THREE.IcosahedronGeometry(br, 0).toNonIndexed();
    setColor(ball, greens[i % 3], 0.14, rng);
    ball.translate(
      x + (rng() - 0.5) * 4.5 * s,
      y + trunkH + br * 0.35 + i * 2.2 * s,
      z + (rng() - 0.5) * 4.5 * s
    );
    geos.push(ball);
  }
}

function addBirch(geos, x, y, z, s, rng) {
  const trunkH = 10 * s;
  const trunk = new THREE.CylinderGeometry(0.35 * s, 0.55 * s, trunkH, 5).toNonIndexed();
  setColor(trunk, 0xeae8de, 0.04, rng);
  trunk.translate(x, y + trunkH / 2, z);
  geos.push(trunk);

  const spots = 4 + Math.floor(rng() * 3);
  for (let i = 0; i < spots; i++) {
    const sg = new THREE.BoxGeometry(0.4 * s, 0.35 * s, 0.06 * s).toNonIndexed();
    setColor(sg, 0x2a2520, 0.1, rng);
    const ang = rng() * Math.PI * 2;
    sg.translate(
      x + Math.cos(ang) * 0.48 * s,
      y + 1.5 * s + rng() * (trunkH - 2.5 * s),
      z + Math.sin(ang) * 0.48 * s
    );
    geos.push(sg);
  }

  for (let i = 0; i < 4; i++) {
    const br = (2.4 + rng() * 1.6) * s;
    const ball = new THREE.IcosahedronGeometry(br, 0).toNonIndexed();
    setColor(ball, 0x78b84a, 0.13, rng);
    ball.translate(
      x + (rng() - 0.5) * 5 * s,
      y + trunkH * 0.5 + i * 2.4 * s,
      z + (rng() - 0.5) * 5 * s
    );
    geos.push(ball);
  }
}

function tryTree(geos, x, z, rng) {
  const h = terrainHeight(x, z);
  if (h < 5 || h > 360) return;
  const dx = terrainHeight(x + 16, z) - terrainHeight(x - 16, z);
  const dz = terrainHeight(x, z + 16) - terrainHeight(x, z - 16);
  if (Math.hypot(dx, dz) / 32 > 0.9) return;
  if (isOnRoad(x, z)) return;

  const s = 0.8 + rng() * 0.85;
  const t = rng();
  if (t < 0.58)      addPine(geos, x, h, z, s, rng);
  else if (t < 0.90) addOak (geos, x, h, z, s, rng);
  else               addBirch(geos, x, h, z, s, rng);
}

/* =========================================================
   HOUSES / TOWERS / VILLAGES / CITIES
   ========================================================= */
function addHouse(geos, x, y, z, rot, rng) {
  const w  = 7 + rng() * 4;
  const d  = 8 + rng() * 4;
  const hh = 6 + rng() * 4;
  const wallCol = [0xe8dcc0, 0xdfc9a8, 0xf0e4c8, 0xd8cdb4][Math.floor(rng()*4)];
  const roofCol = [0xa8453a, 0x8f4a3a, 0x6e4a3a, 0xb5503f][Math.floor(rng()*4)];

  const body = new THREE.BoxGeometry(w, hh, d).toNonIndexed();
  setColor(body, wallCol, 0.055, rng);
  body.translate(0, hh/2, 0);

  const roof = new THREE.ConeGeometry(Math.max(w, d) * 0.78, hh * 0.75, 4).toNonIndexed();
  setColor(roof, roofCol, 0.06, rng);
  roof.rotateY(Math.PI / 4);
  roof.translate(0, hh + hh * 0.375, 0);

  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), rot),
    new THREE.Vector3(1,1,1)
  );
  body.applyMatrix4(m); roof.applyMatrix4(m);
  geos.push(body, roof);
}

function addTower(geos, x, y, z, rng) {
  const tw = new THREE.CylinderGeometry(2.8, 3.8, 22, 6).toNonIndexed();
  setColor(tw, 0xd4bf98, 0.08, rng);
  tw.translate(x, y + 11, z);
  geos.push(tw);
  const roof = new THREE.ConeGeometry(4.6, 7, 6).toNonIndexed();
  setColor(roof, 0x8a4030, 0.08, rng);
  roof.translate(x, y + 22 + 3.5, z);
  geos.push(roof);
  const band = new THREE.CylinderGeometry(3.4, 3.4, 1.5, 6).toNonIndexed();
  setColor(band, 0x4a3a2e, 0.05, rng);
  band.translate(x, y + 17, z);
  geos.push(band);
}

function addBuilding(geos, x, y, z, w, h, d, bcol, roofCol, rng) {
  const b = new THREE.BoxGeometry(w, h, d).toNonIndexed();
  setColor(b, bcol, 0.045, rng);
  b.translate(x, y + h / 2, z);
  geos.push(b);

  if (h > 18) {
    const nWinY = Math.floor(h / 8);
    const nWinX = Math.max(1, Math.floor(w / 6));

    for (let iy = 0; iy < nWinY; iy++) {
      for (let ix = 0; ix < nWinX; ix++) {
        if (rng() < 0.28) continue;
        const wg = new THREE.PlaneGeometry(2, 2.8).toNonIndexed();
        setColor(wg, 0x1a3a5a, 0.14, rng);
        const wx = x - w/2 + (w / nWinX) * (ix + 0.5);
        const wy = y + h * 0.14 + (h * 0.8 / nWinY) * (iy + 0.5);
        wg.translate(wx, wy, z + d/2 + 0.05);
        geos.push(wg);
      }
      for (let ix = 0; ix < nWinX; ix++) {
        if (rng() < 0.4) continue;
        const wg = new THREE.PlaneGeometry(2, 2.8).toNonIndexed();
        setColor(wg, 0x1a3a5a, 0.14, rng);
        wg.rotateY(Math.PI);
        const wx = x + w/2 - (w / nWinX) * (ix + 0.5);
        const wy = y + h * 0.14 + (h * 0.8 / nWinY) * (iy + 0.5);
        wg.translate(wx, wy, z - d/2 - 0.05);
        geos.push(wg);
      }
    }
  }

  const roof = new THREE.BoxGeometry(w + 1.2, 1.6, d + 1.2).toNonIndexed();
  setColor(roof, roofCol, 0.045, rng);
  roof.translate(x, y + h + 0.8, z);
  geos.push(roof);
}

function addVillage(geos, villages, cx, cz, rng) {
  const vh = terrainHeight(cx, cz);
  if (vh < 5 || vh > 330) return;
  if (isOnRoad(cx, cz)) return;

  let maxD = 0;
  for (let a = 0; a < 10; a++) {
    const ang = (a / 10) * Math.PI * 2;
    const px = cx + Math.cos(ang) * 110;
    const pz = cz + Math.sin(ang) * 110;
    maxD = Math.max(maxD, Math.abs(terrainHeight(px, pz) - vh));
  }
  if (maxD > 45) return;

  const plaza = new THREE.CylinderGeometry(18, 18, 1, 8).toNonIndexed();
  setColor(plaza, 0x8a6a4a, 0.1, rng);
  plaza.translate(cx, vh + 0.6, cz);
  geos.push(plaza);

  const inner = 4 + Math.floor(rng() * 3);
  const outer = 5 + Math.floor(rng() * 4);
  for (let i = 0; i < inner; i++) {
    const ang = (i / inner) * Math.PI * 2 + rng() * 0.3;
    const rad = 30 + rng() * 18;
    const hx = cx + Math.cos(ang) * rad;
    const hz = cz + Math.sin(ang) * rad;
    if (isOnRoad(hx, hz)) continue;
    const hh = terrainHeight(hx, hz);
    if (hh < 3) continue;
    addHouse(geos, hx, hh, hz, ang + Math.PI / 2, rng);
  }
  for (let i = 0; i < outer; i++) {
    const ang = (i / outer) * Math.PI * 2 + 0.4 + rng() * 0.3;
    const rad = 58 + rng() * 26;
    const hx = cx + Math.cos(ang) * rad;
    const hz = cz + Math.sin(ang) * rad;
    if (isOnRoad(hx, hz)) continue;
    const hh = terrainHeight(hx, hz);
    if (hh < 3 || Math.abs(hh - vh) > 32) continue;
    addHouse(geos, hx, hh, hz, ang + Math.PI / 2, rng);
  }

  const nTowers = rng() < 0.6 ? 2 : 1;
  for (let i = 0; i < nTowers; i++) {
    const ang = rng() * Math.PI * 2;
    const rad = 20 + rng() * 30;
    const tx = cx + Math.cos(ang) * rad;
    const tz = cz + Math.sin(ang) * rad;
    if (isOnRoad(tx, tz)) continue;
    const th = terrainHeight(tx, tz);
    if (th < 3) continue;
    addTower(geos, tx, th, tz, rng);
  }

  const nFields = 3 + Math.floor(rng() * 4);
  for (let i = 0; i < nFields; i++) {
    const ang = rng() * Math.PI * 2;
    const rad = 85 + rng() * 55;
    const fx = cx + Math.cos(ang) * rad;
    const fz = cz + Math.sin(ang) * rad;
    if (isOnRoad(fx, fz)) continue;
    const fh = terrainHeight(fx, fz);
    if (fh < 3 || Math.abs(fh - vh) > 25) continue;
    const fw = 18 + rng() * 20;
    const fd = 24 + rng() * 18;
    const field = new THREE.PlaneGeometry(fw, fd, 1, 1).toNonIndexed();
    field.rotateX(-Math.PI / 2);
    field.rotateY(rng() * Math.PI);
    field.translate(fx, fh + 0.4, fz);
    setColor(field, [0xb5c060, 0x8a9a45, 0x9c7a45, 0xa8b854][Math.floor(rng()*4)], 0.1, rng);
    geos.push(field);
  }

  villages.push({ x: cx, z: cz });
}

function addCity(geos, cities, cx, cz, rng) {
  const vh = terrainHeight(cx, cz);
  if (vh < 5 || vh > 260) return;

  let maxD = 0;
  for (let a = 0; a < 12; a++) {
    const ang = (a / 12) * Math.PI * 2;
    const px = cx + Math.cos(ang) * 170;
    const pz = cz + Math.sin(ang) * 170;
    maxD = Math.max(maxD, Math.abs(terrainHeight(px, pz) - vh));
  }
  if (maxD > 55) return;

  const plaza = new THREE.CylinderGeometry(38, 38, 1.2, 10).toNonIndexed();
  setColor(plaza, 0x9a8a76, 0.06, rng);
  plaza.translate(cx, vh + 0.7, cz);
  geos.push(plaza);

  if (rng() < 0.65) {
    const mon = new THREE.CylinderGeometry(3, 5, 14, 6).toNonIndexed();
    setColor(mon, 0xc8c0b0, 0.06, rng);
    mon.translate(cx, vh + 7, cz);
    geos.push(mon);
    const tip = new THREE.ConeGeometry(3, 5, 6).toNonIndexed();
    setColor(tip, 0xffd35c, 0.08, rng);
    tip.translate(cx, vh + 14 + 2.5, cz);
    geos.push(tip);
  }

  const gridN = 3;
  const spacing = 62;
  for (let i = -gridN; i <= gridN; i++) {
    for (let j = -gridN; j <= gridN; j++) {
      const dist = Math.hypot(i, j);
      if (dist > gridN + 0.3) continue;
      if (i === 0 && j === 0) continue;
      if (rng() < 0.13) continue;

      const bx = cx + i * spacing + (rng() - 0.5) * 10;
      const bz = cz + j * spacing + (rng() - 0.5) * 10;
      const bh = terrainHeight(bx, bz);
      if (bh < 3) continue;
      if (isOnRoad(bx, bz)) continue;

      const centrality = 1 - dist / (gridN + 1);
      const hMul = 0.6 + centrality * 2.4;
      const h = (11 + rng() * 16) * hMul;
      const w = 20 + rng() * 12;
      const d = 20 + rng() * 12;

      const bt = rng();
      let bcol, roofCol;
      if (bt < 0.42) {
        bcol = [0xa8b0b8, 0x8898a8, 0xb8c0c8][Math.floor(rng()*3)];
        roofCol = 0x5a626a;
      } else if (bt < 0.72) {
        bcol = [0xd8c8b0, 0xe8d8c0, 0xc8b8a0][Math.floor(rng()*3)];
        roofCol = [0x8a4a3a, 0xa85040][Math.floor(rng()*2)];
      } else {
        bcol = [0xc0a890, 0xd8b8a0][Math.floor(rng()*2)];
        roofCol = 0x7a5040;
      }

      addBuilding(geos, bx, bh, bz, w, h, d, bcol, roofCol, rng);
    }
  }

  for (let i = 0; i < 10; i++) {
    const ang = rng() * Math.PI * 2;
    const rad = 90 + rng() * 70;
    const tx = cx + Math.cos(ang) * rad;
    const tz = cz + Math.sin(ang) * rad;
    if (isOnRoad(tx, tz)) continue;
    const th = terrainHeight(tx, tz);
    if (th < 3) continue;
    addOak(geos, tx, th, tz, 0.8 + rng() * 0.4, rng);
  }

  cities.push({ x: cx, z: cz });
}

/* =========================================================
   ROAD MESHES + BRIDGES
   ========================================================= */
function addRoads(cx, cz, geos, rng) {
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;
  const cxm = ox + CHUNK_SIZE * 0.5;
  const czm = oz + CHUNK_SIZE * 0.5;

  // Z-roads
  const kxMin = Math.floor(ox / ROAD_SPACING) - 1;
  const kxMax = Math.ceil((ox + CHUNK_SIZE) / ROAD_SPACING) + 1;
  for (let k = kxMin; k <= kxMax; k++) {
    const roadX = k * ROAD_SPACING;
    if (roadX < ox || roadX >= ox + CHUNK_SIZE) continue;

    const th1 = terrainHeight(roadX, oz);
    const th2 = terrainHeight(roadX, czm);
    const th3 = terrainHeight(roadX, oz + CHUNK_SIZE);
    if (Math.max(th1, th2, th3) > ROAD_TARGET_H + 3) continue;

    const g = new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_SIZE).toNonIndexed();
    g.rotateX(-Math.PI / 2);
    g.translate(roadX, ROAD_TARGET_H + 0.35, czm);
    setColor(g, 0x36363d, 0.05, rng);
    geos.push(g);
  }

  // X-roads
  const kzMin = Math.floor(oz / ROAD_SPACING) - 1;
  const kzMax = Math.ceil((oz + CHUNK_SIZE) / ROAD_SPACING) + 1;
  for (let k = kzMin; k <= kzMax; k++) {
    const roadZ = k * ROAD_SPACING;
    if (roadZ < oz || roadZ >= oz + CHUNK_SIZE) continue;

    const th1 = terrainHeight(ox, roadZ);
    const th2 = terrainHeight(cxm, roadZ);
    const th3 = terrainHeight(ox + CHUNK_SIZE, roadZ);
    if (Math.max(th1, th2, th3) > ROAD_TARGET_H + 3) continue;

    const g = new THREE.PlaneGeometry(CHUNK_SIZE, ROAD_WIDTH).toNonIndexed();
    g.rotateX(-Math.PI / 2);
    g.translate(cxm, ROAD_TARGET_H + 0.42, roadZ);
    setColor(g, 0x36363d, 0.05, rng);
    geos.push(g);
  }
}

function addBridges(cx, cz, geos, rng) {
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;
  const half = CHUNK_SIZE * 0.5;

  // Z-road pillars
  const kxMin = Math.floor((ox - half) / ROAD_SPACING) - 1;
  const kxMax = Math.ceil((ox + half) / ROAD_SPACING) + 1;
  for (let k = kxMin; k <= kxMax; k++) {
    const roadX = k * ROAD_SPACING;
    if (roadX < ox || roadX >= ox + CHUNK_SIZE) continue;
    for (let z = oz + 40; z < oz + CHUNK_SIZE - 20; z += 80) {
      const bh = baseHeight(roadX, z);
      if (bh < -3) {
        const h = ROAD_TARGET_H - bh + 2;
        const p = new THREE.CylinderGeometry(1.7, 2.4, h, 5).toNonIndexed();
        setColor(p, 0x9a9a9a, 0.08, rng);
        p.translate(roadX, bh + h / 2 - 1, z);
        geos.push(p);
      }
    }
  }

  // X-road pillars
  const kzMin = Math.floor((oz - half) / ROAD_SPACING) - 1;
  const kzMax = Math.ceil((oz + half) / ROAD_SPACING) + 1;
  for (let k = kzMin; k <= kzMax; k++) {
    const roadZ = k * ROAD_SPACING;
    if (roadZ < oz || roadZ >= oz + CHUNK_SIZE) continue;
    for (let x = ox + 40; x < ox + CHUNK_SIZE - 20; x += 80) {
      const bh = baseHeight(x, roadZ);
      if (bh < -3) {
        const h = ROAD_TARGET_H - bh + 2;
        const p = new THREE.CylinderGeometry(1.7, 2.4, h, 5).toNonIndexed();
        setColor(p, 0x9a9a9a, 0.08, rng);
        p.translate(x, bh + h / 2 - 1, roadZ);
        geos.push(p);
      }
    }
  }
}

/* =========================================================
   CHUNK BUILDING
   ========================================================= */
const CHUNK_SIZE = 520;
const CHUNK_SEG  = 22;
const VIEW_R     = 4;

const chunkMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const chunkMeshes = new Map();

function buildProps(cx, cz, geos, villages, cities) {
  const rng = mulberry32(chunkSeed(cx, cz));
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;

  addRoads(cx, cz, geos, rng);
  addBridges(cx, cz, geos, rng);

  const treeCount = 12 + Math.floor(rng() * 10);
  for (let i = 0; i < treeCount; i++) {
    const x = ox + (rng() - 0.5) * CHUNK_SIZE * 0.96;
    const z = oz + (rng() - 0.5) * CHUNK_SIZE * 0.96;
    tryTree(geos, x, z, rng);
  }

  const rockCount = 3 + Math.floor(rng() * 5);
  for (let i = 0; i < rockCount; i++) {
    const x = ox + (rng() - 0.5) * CHUNK_SIZE;
    const z = oz + (rng() - 0.5) * CHUNK_SIZE;
    if (isOnRoad(x, z)) continue;
    const h = terrainHeight(x, z);
    if (h < 0) continue;
    const s = 1 + rng() * 3;
    const rock = new THREE.IcosahedronGeometry(s, 0).toNonIndexed();
    setColor(rock, 0x808078, 0.15, rng);
    rock.translate(x, h + s * 0.4, z);
    geos.push(rock);
  }

  // City at road intersection
  if (rng() < 0.55) {
    const kx = Math.round((ox + CHUNK_SIZE * 0.5) / ROAD_SPACING);
    const kz = Math.round((oz + CHUNK_SIZE * 0.5) / ROAD_SPACING);
    const cxw = kx * ROAD_SPACING;
    const czw = kz * ROAD_SPACING;
    if (cxw >= ox && cxw < ox + CHUNK_SIZE && czw >= oz && czw < oz + CHUNK_SIZE) {
      addCity(geos, cities, cxw, czw, rng);
    }
  }

  if (rng() < 0.42) {
    const vx = ox + (rng() - 0.5) * CHUNK_SIZE * 0.55;
    const vz = oz + (rng() - 0.5) * CHUNK_SIZE * 0.55;
    addVillage(geos, villages, vx, vz, rng);
  }
}

function buildChunk(cx, cz) {
  const geos = [];
  const villages = [];
  const cities = [];

  const size = CHUNK_SIZE, seg = CHUNK_SEG;
  const tg = new THREE.PlaneGeometry(size, size, seg, seg);
  tg.rotateX(-Math.PI / 2);
  tg.translate(cx * size, 0, cz * size);

  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    tp.setY(i, terrainHeight(tp.getX(i), tp.getZ(i)));
  }

  const terrain = tg.toNonIndexed();
  tg.dispose();

  const tpos = terrain.attributes.position;
  const cnt = tpos.count;
  const colors = new Float32Array(cnt * 3);
  const col = new THREE.Color();

  for (let f = 0; f < cnt; f += 3) {
    const ax = tpos.getX(f),     ay = tpos.getY(f),     az = tpos.getZ(f);
    const bx = tpos.getX(f + 1), by = tpos.getY(f + 1), bz = tpos.getZ(f + 1);
    const cx2 = tpos.getX(f + 2), cy2 = tpos.getY(f + 2), cz2 = tpos.getZ(f + 2);

    const avgY = (ay + by + cy2) / 3;
    const e1x = bx - ax, e1y = by - ay, e1z = bz - az;
    const e2x = cx2 - ax, e2y = cy2 - ay, e2z = cz2 - az;
    let nx = e1y * e2z - e1z * e2y;
    let ny = e1z * e2x - e1x * e2z;
    let nz = e1x * e2y - e1y * e2x;
    const len = Math.hypot(nx, ny, nz) || 1;
    ny = Math.abs(ny / len);
    pickColor(avgY, ny, col);
    for (let k = 0; k < 3; k++) {
      colors[(f+k)*3]     = col.r;
      colors[(f+k)*3 + 1] = col.g;
      colors[(f+k)*3 + 2] = col.b;
    }
  }
  terrain.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geos.push(terrain);

  buildProps(cx, cz, geos, villages, cities);

  const merged = mergeGeos(geos);
  merged.computeBoundingSphere();
  const mesh = new THREE.Mesh(merged, chunkMat);
  mesh.frustumCulled = true;

  return { mesh, villages, cities };
}

/* =========================================================
   CHUNK STREAMING
   ========================================================= */
function updateChunks(px, pz, budget) {
  const ccx = Math.floor(px / CHUNK_SIZE);
  const ccz = Math.floor(pz / CHUNK_SIZE);

  for (const [key, data] of chunkMeshes) {
    const comma = key.indexOf(',');
    const cx = +key.slice(0, comma);
    const cz = +key.slice(comma + 1);
    if (Math.abs(cx - ccx) > VIEW_R + 1 || Math.abs(cz - ccz) > VIEW_R + 1) {
      scene.remove(data.mesh);
      data.mesh.geometry.dispose();
      chunkMeshes.delete(key);
    }
  }

  const missing = [];
  const R = VIEW_R + 0.5;
  for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
    for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
      if (dx*dx + dz*dz > R*R) continue;
      const cx = ccx + dx, cz = ccz + dz;
      const key = cx + ',' + cz;
      if (!chunkMeshes.has(key)) missing.push({ cx, cz, d: dx*dx + dz*dz });
    }
  }
  missing.sort((a, b) => a.d - b.d);

  const n = Math.min(budget, missing.length);
  for (let i = 0; i < n; i++) {
    const { cx, cz } = missing[i];
    const key = cx + ',' + cz;
    if (chunkMeshes.has(key)) continue;
    const data = buildChunk(cx, cz);
    chunkMeshes.set(key, data);
    scene.add(data.mesh);
  }
}

/* =========================================================
   JET MODEL (detailed)
   ========================================================= */
function createJet() {
  const g = new THREE.Group();
  const D = THREE.DoubleSide;

  const whiteMat = new THREE.MeshLambertMaterial({ color: 0xe8eef4, flatShading: true, side: D });
  const grayMat  = new THREE.MeshLambertMaterial({ color: 0x6a7a8a, flatShading: true, side: D });
  const darkMat  = new THREE.MeshLambertMaterial({ color: 0x3a4552, flatShading: true, side: D });
  const redMat   = new THREE.MeshLambertMaterial({ color: 0xd83030, flatShading: true, side: D });
  const blueMat  = new THREE.MeshLambertMaterial({ color: 0x2a6aaa, flatShading: true, side: D });
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x1a9ad8, emissive: 0x082838, flatShading: true, side: D });

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.0, 9, 8), whiteMat);
  fus.rotation.x = Math.PI / 2;
  g.add(fus);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.85, 3.5, 8), whiteMat);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -6.25;
  g.add(nose);

  const noseTip = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.8, 8), darkMat);
  noseTip.rotation.x = -Math.PI / 2;
  noseTip.position.z = -7.85;
  g.add(noseTip);

  const cock = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), glassMat);
  cock.scale.set(1, 0.85, 2.0);
  cock.position.set(0, 0.5, -1.5);
  g.add(cock);

  function makeWing(sign) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 2.5);
    shape.lineTo(sign * 5.5, 0.8);
    shape.lineTo(sign * 5.5, -0.5);
    shape.lineTo(sign * 3.5, -1.2);
    shape.lineTo(0, -2.0);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, -0.15, 0);
    return geo;
  }
  g.add(new THREE.Mesh(makeWing(1), whiteMat));
  g.add(new THREE.Mesh(makeWing(-1), whiteMat));

  [1, -1].forEach(sign => {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 4.5), redMat);
    stripe.position.set(sign * 3.5, 0.02, 0.5);
    g.add(stripe);
  });

  [1, -1].forEach(sign => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 1.5), blueMat);
    tip.position.set(sign * 5.5, 0, 0.3);
    g.add(tip);
  });

  const finShape = new THREE.Shape();
  finShape.moveTo(0, 0);
  finShape.lineTo(0.3, 2.8);
  finShape.lineTo(1.8, 2.6);
  finShape.lineTo(2.0, 0.2);
  finShape.closePath();
  const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.18, bevelEnabled: false });
  finGeo.rotateY(-Math.PI / 2);
  finGeo.translate(-0.09, 0.4, 2.8);
  g.add(new THREE.Mesh(finGeo, redMat));

  [1, -1].forEach(sign => {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0.7);
    shape.lineTo(sign * 2.2, 0.3);
    shape.lineTo(sign * 2.2, -0.3);
    shape.lineTo(0, -0.7);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, -0.08, 3.5);
    g.add(new THREE.Mesh(geo, whiteMat));
  });

  [1, -1].forEach(sign => {
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 2.4, 8), darkMat);
    eng.rotation.x = Math.PI / 2;
    eng.position.set(sign * 1.0, -0.05, 2.5);
    g.add(eng);

    const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.5, 0.3, 8), grayMat);
    nozzle.rotation.x = Math.PI / 2;
    nozzle.position.set(sign * 1.0, -0.05, 3.8);
    g.add(nozzle);
  });

  const navRed = new THREE.Mesh(new THREE.SphereGeometry(0.18, 5, 4),
    new THREE.MeshBasicMaterial({ color: 0xff2020 }));
  navRed.position.set(-5.5, 0.1, 0.3);
  g.add(navRed);

  const navGreen = new THREE.Mesh(new THREE.SphereGeometry(0.18, 5, 4),
    new THREE.MeshBasicMaterial({ color: 0x20ff20 }));
  navGreen.position.set(5.5, 0.1, 0.3);
  g.add(navGreen);

  const flameMat = new THREE.MeshBasicMaterial({
    color: 0x6fe0ff, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const flames = [];
  [1, -1].forEach(sign => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3, 8), flameMat);
    f.rotation.x = Math.PI / 2;
    f.position.set(sign * 1.0, -0.05, 4.5);
    g.add(f);
    flames.push(f);
  });

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: engineGlowTex, color: 0x6fe0ff,
    transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true
  }));
  glow.scale.setScalar(6);
  glow.position.set(0, -0.05, 4.8);
  g.add(glow);

  g.userData.flames = flames;
  g.userData.flameMat = flameMat;
  g.userData.glow = glow;
  return g;
}

const cloudMat = new THREE.MeshLambertMaterial({
  color: 0xffffff, flatShading: true, transparent: true, opacity: 0.94
});
function createCloudGeo() {
  const geos = [];
  const n = 5 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const s = 38 + Math.random() * 55;
    const g = new THREE.IcosahedronGeometry(s, 0);
    g.translate((Math.random()-0.5)*170, (Math.random()-0.5)*50, (Math.random()-0.5)*120);
    geos.push(g);
  }
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.computeVertexNormals();
  return out;
}
const clouds = [];
for (let i = 0; i < 38; i++) {
  const m = new THREE.Mesh(createCloudGeo(), cloudMat);
  m.position.set(rand(-3200, 3200), rand(700, 1600), rand(-3200, 3200));
  m.scale.setScalar(rand(0.9, 2.1));
  scene.add(m); clouds.push(m);
}

   EXPLOSION
   ========================================================= */
const MAX_SPARKS = 120;
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(MAX_SPARKS * 3);
const sparkCol = new Float32Array(MAX_SPARKS * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
const sparkMat = new THREE.PointsMaterial({
  size: 5, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
sparkPoints.frustumCulled = false;
scene.add(sparkPoints);

const sparks = [];
for (let i = 0; i < MAX_SPARKS; i++) {
  sparks.push({ x:0,y:0,z:0, vx:0,vy:0,vz:0, life:0, maxLife:1, r:1,g:1,b:1 });
  sparkPos[i*3+1] = -99999;
}

const fireballMat = new THREE.MeshBasicMaterial({
  color: 0xffaa33, transparent: true, opacity: 1,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const fireball = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), fireballMat);
fireball.visible = false;
fireball.frustumCulled = false;
scene.add(fireball);
let fireballT = 0;

function spawnExplosion(pos) {
  fireball.position.copy(pos);
  fireball.scale.setScalar(3);
  fireballMat.opacity = 1;
  fireball.visible = true;
  fireballT = 0;
  for (let i = 0; i < MAX_SPARKS; i++) {
    const s = sparks[i];
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = rand(40, 260);
    s.x = pos.x; s.y = pos.y; s.z = pos.z;
    s.vx = Math.sin(phi) * Math.cos(theta) * speed;
    s.vy = Math.cos(phi) * speed;
    s.vz = Math.sin(phi) * Math.sin(theta) * speed;
    s.life = rand(0.7, 1.7);
    s.maxLife = s.life;
    const c = Math.random();
    if (c < 0.4)      { s.r = 1.0; s.g = 1.0; s.b = 0.85; }
    else if (c < 0.75){ s.r = 1.0; s.g = 0.55; s.b = 0.15; }
    else              { s.r = 1.0; s.g = 0.25; s.b = 0.1; }
  }
}

function updateExplosion(dt) {
  if (fireball.visible) {
    fireballT += dt;
    const t = fireballT / 0.9;
    if (t >= 1) fireball.visible = false;
    else {
      fireball.scale.setScalar(3 + t * 48);
      fireballMat.opacity = 1 - t;
    }
  }
  let anyAlive = false;
  for (let i = 0; i < MAX_SPARKS; i++) {
    const s = sparks[i];
    if (s.life <= 0) continue;
    anyAlive = true;
    s.life -= dt;
    if (s.life <= 0) { sparkPos[i*3+1] = -99999; continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.vx *= Math.exp(-1.8 * dt);
    s.vy *= Math.exp(-1.8 * dt);
    s.vz *= Math.exp(-1.8 * dt);
    s.vy -= 60 * dt;
    const fade = s.life / s.maxLife;
    const fl = 0.4 + fade * 0.6;
    sparkPos[i*3]     = s.x;
    sparkPos[i*3 + 1] = s.y;
    sparkPos[i*3 + 2] = s.z;
    sparkCol[i*3]     = s.r * fl;
    sparkCol[i*3 + 1] = s.g * fl;
    sparkCol[i*3 + 2] = s.b * fl;
  }
  if (anyAlive) {
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;
  }
}

const joyEl   = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
const thrEl   = document.getElementById('thrZone');
const thrFill = document.getElementById('thrFill');
const thrKnob = document.getElementById('thrKnob');

const joy = { id: null, x: 0, y: 0, cx: 0, cy: 0, radius: 55 };
const thr = { id: null, value: 0.5 };

function refreshControlRects() {
  const jr = joyEl.getBoundingClientRect();
  joy.cx = jr.left + jr.width / 2;
  joy.cy = jr.top + jr.height / 2;
  joy.radius = jr.width * 0.36;
}
function updateJoyKnob() {
  joyKnob.style.transform = `translate(${joy.x * joy.radius}px, ${-joy.y * joy.radius}px)`;
}
function updateThrVisual() {
  const pct = thr.value * 100;
  thrFill.style.height = pct + '%';
  thrKnob.style.bottom = pct + '%';
}
refreshControlRects();
updateThrVisual();
window.addEventListener('resize', refreshControlRects);

window.addEventListener('pointerdown', e => {
  if (state.phase !== 'play') return;
  const x = e.clientX, y = e.clientY;

  const jr = joyEl.getBoundingClientRect();
  if (joy.id === null &&
      x >= jr.left - 10 && x <= jr.right + 10 &&
      y >= jr.top - 10 && y <= jr.bottom + 10) {
    joy.id = e.pointerId;
    const dx = x - joy.cx;
    const dy = y - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) {
      const k = Math.min(d, joy.radius) / d;
      joy.x = clamp(dx * k / joy.radius, -1, 1);
      joy.y = clamp(-dy * k / joy.radius, -1, 1);
    }
    updateJoyKnob();
    return;
  }

  const tr = thrEl.getBoundingClientRect();
  if (thr.id === null &&
      x >= tr.left - 14 && x <= tr.right + 14 &&
      y >= tr.top - 10 && y <= tr.bottom + 10) {
    thr.id = e.pointerId;
    thr.value = clamp(1 - (y - tr.top) / tr.height, 0, 1);
    updateThrVisual();
  }
}, { passive: false });

window.addEventListener('pointermove', e => {
  if (joy.id === e.pointerId) {
    const dx = e.clientX - joy.cx;
    const dy = e.clientY - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) {
      const k = Math.min(d, joy.radius) / d;
      joy.x = clamp(dx * k / joy.radius, -1, 1);
      joy.y = clamp(-dy * k / joy.radius, -1, 1);
    }
    updateJoyKnob();
  }
  if (thr.id === e.pointerId) {
    const tr = thrEl.getBoundingClientRect();
    thr.value = clamp(1 - (e.clientY - tr.top) / tr.height, 0, 1);
    updateThrVisual();
  }
}, { passive: false });

function endPointer(e) {
  if (joy.id === e.pointerId) { joy.id = null; joy.x = 0; joy.y = 0; updateJoyKnob(); }
  if (thr.id === e.pointerId) thr.id = null;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if ((k === ' ' || k === 'enter') && state.phase !== 'play') startGame();
}, { passive: false });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  joy.id = null; joy.x = 0; joy.y = 0; thr.id = null;
  updateJoyKnob();
});

startBtn.addEventListener('click', startGame);

/* ---------- Input helper with dead zone ---------- */
function getJoystickInput() {
  let ix = joy.x, iy = joy.y;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy += 1;
  if (keys['s'] || keys['arrowdown'])  iy -= 1;

  const DEAD = 0.12;
  if (Math.abs(ix) < DEAD) ix = 0;
  if (Math.abs(iy) < DEAD) iy = 0;

  ix = clamp(ix, -1, 1); iy = clamp(iy, -1, 1);
  const m = Math.hypot(ix, iy);
  if (m > 1) { ix /= m; iy /= m; }
  return { x: ix, y: iy };
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function startGame() {
  state.phase = 'play';
  state.score = 0;
  state.multiplier = 1;
  state.travel = 0;
  state.invuln = 1.3;
  state.shake = 0;
  state.exploding = false;
  state.poiFound = 0;
  visitedPOIs.clear();

  const th = Math.max(terrainHeight(0, 0), 0);
  jet.pos.set(0, th + 380, 0);
  jet.yaw = 0; jet.pitch = 0; jet.roll = 0;
  jet.vy = 0; jet.speed = 100;
  jet.boost = 100;
  jet.throttle = 0.5;
  thr.value = 0.5;
  updateThrVisual();

  jetGroup.visible = true;

  camera.position.set(
    jet.pos.x + Math.sin(jet.yaw) * 24,
    jet.pos.y + 9,
    jet.pos.z + Math.cos(jet.yaw) * 24
  );

  overlay.classList.add('hide');
  updateHUD(true);
}

function gameOver() {
  state.phase = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem('skyrunner3d_best2', String(state.best)); } catch (e) {}
  }
  title.textContent = 'FLIGHT ENDED';
  subtitle.innerHTML =
    `SCORE <b style="color:#4fe3ff">${state.score}</b>` +
    ` &nbsp;·&nbsp; BEST <b style="color:#ffd35c">${state.best}</b>` +
    `<br><span style="font-size:11px;opacity:.75">Distance: ${(state.travel/1000).toFixed(2)} km &nbsp;·&nbsp; POIs: ${state.poiFound}</span>`;
  startBtn.textContent = 'FLY AGAIN';
  overlay.classList.remove('hide');
  updateHUD(true);
}

function crash() {
  if (state.exploding) return;
  state.exploding = true;
  spawnExplosion(jet.pos.clone());
  jetGroup.visible = false;
  jetShadow.visible = false;

  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 240);

  state.shake = 32;
  state.multiplier = 1;

  setTimeout(() => {
    const x = jet.pos.x + rand(-220, 220);
    const z = jet.pos.z + rand(-220, 220);
    const th = Math.max(terrainHeight(x, z), 0);
    jet.pos.set(x, th + 400, z);
    jet.yaw = jet.yaw + rand(-0.35, 0.35);
    jet.pitch = 0; jet.roll = 0; jet.vy = 0;
    jet.speed = 100;
    jetGroup.visible = true;
    state.invuln = 2.0;
    state.exploding = false;
    camera.position.set(
      jet.pos.x + Math.sin(jet.yaw) * 24,
      jet.pos.y + 9,
      jet.pos.z + Math.cos(jet.yaw) * 24
    );
  }, 1700);
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  const playing = state.phase === 'play' && !state.exploding;

  if (state.phase === 'play') {
    if (keys['e'] || keys['+'] || keys['=']) {
      thr.value = Math.min(1, thr.value + dt * 0.5);
      updateThrVisual();
    }
    if (keys['q'] || keys['-']) {
      thr.value = Math.max(0, thr.value - dt * 0.5);
      updateThrVisual();
    }
  }
  jet.throttle = thr.value;

  if (playing) {
    const input = getJoystickInput();

    /* ---- EASY / SLOW STEERING ---- */
    const PITCH_MAX = 0.5;
    const ROLL_MAX  = 0.72;
    const targetPitch = input.y * PITCH_MAX;
    const targetRoll  = input.x * ROLL_MAX;

    const pk = 1 - Math.exp(-3.0 * dt);
    const rk = 1 - Math.exp(-3.5 * dt);
    jet.pitch += (targetPitch - jet.pitch) * pk;
    jet.roll  += (targetRoll  - jet.roll)  * rk;

    /* auto-level when idle */
    if (Math.abs(input.x) < 0.08 && Math.abs(input.y) < 0.08) {
      jet.pitch *= Math.exp(-1.8 * dt);
      jet.roll  *= Math.exp(-1.5 * dt);
    }

    /* ---- SLOWER SPEEDS ---- */
    const boosting = !!keys['shift'] && jet.boost > 1;
    const targetSpeed = (60 + jet.throttle * 190) * (boosting ? 1.32 : 1);
    jet.speed += (targetSpeed - jet.speed) * (1 - Math.exp(-2.4 * dt));

    if (boosting) jet.boost = Math.max(0, jet.boost - 24 * dt);
    else          jet.boost = Math.min(100, jet.boost + 15 * dt);

    /* ---- GENTLER YAW COUPLING ---- */
    const turnAuthority = clamp(jet.speed / 200, 0.5, 1.25);
    jet.yaw -= jet.roll * 1.25 * turnAuthority * dt;

    /* ---- NO GRAVITY (friendly) ---- */
    const targetVy = Math.sin(jet.pitch) * jet.speed * 1.55;
    jet.vy += (targetVy - jet.vy) * (1 - Math.exp(-3.0 * dt));
    jet.vy = clamp(jet.vy, -420, 420);

    const horiz = jet.speed * Math.cos(jet.pitch * 0.75);
    const fwdX = -Math.sin(jet.yaw);
    const fwdZ = -Math.cos(jet.yaw);

    jet.pos.x += fwdX * horiz * dt;
    jet.pos.z += fwdZ * horiz * dt;
    jet.pos.y += jet.vy * dt;

    if (jet.pos.y > 2600) { jet.pos.y = 2600; jet.vy = Math.min(jet.vy, 0); }

    if (state.invuln > 0) state.invuln -= dt;
    const groundH = Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0);
    if (jet.pos.y < groundH + 9 && state.invuln <= 0) crash();

    const dist = jet.speed * dt;
    state.travel += dist;
    state.score += Math.floor(dist * 0.05 * state.multiplier);
  } else if (state.phase === 'menu' || state.phase === 'over') {
    jet.pos.z -= 150 * dt;
    jet.pos.x += (Math.sin(performance.now() * 0.00013) * 160 - jet.pos.x) * (1 - Math.exp(-1.2 * dt));
    jet.pos.y += (Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0) + 380 - jet.pos.y) * (1 - Math.exp(-1.2 * dt));
    jet.pitch *= Math.exp(-2 * dt);
    jet.roll *= Math.exp(-2 * dt);
    jet.vy = 0;
    state.travel += 150 * dt;
  }

  /* ---------- jet transform + fx ---------- */
  jetGroup.position.copy(jet.pos);
  jetGroup.rotation.set(jet.pitch, jet.yaw, -jet.roll);

  const boostingFx = playing && !!keys['shift'] && jet.boost > 1;
  const fm = jetGroup.userData.flameMat;
  const flen = 0.75 + Math.random() * 0.3 + (boostingFx ? 1.0 : 0);
  jetGroup.userData.flames.forEach(f => {
    f.scale.set(0.85 + Math.random() * 0.25, flen, 0.85 + Math.random() * 0.25);
  });
  fm.color.setHex(boostingFx ? 0xa8f0ff : 0x6fe0ff);
  fm.opacity = boostingFx ? 1 : 0.85;
  if (jetGroup.userData.glow) {
    jetGroup.userData.glow.scale.setScalar(boostingFx ? 9 : 6);
    jetGroup.userData.glow.material.color.setHex(boostingFx ? 0xa8f0ff : 0x6fe0ff);
  }

  /* ---------- shadow ---------- */
  const groundY = terrainHeight(jet.pos.x, jet.pos.z);
  const altAbove = jet.pos.y - Math.max(groundY, 0);
  if (altAbove > 0 && altAbove < 700) {
    const sSize = 4 + altAbove * 0.028;
    const sOp = Math.max(0, 0.55 - altAbove * 0.0007);
    jetShadow.position.set(jet.pos.x, Math.max(groundY, 0) + 0.5, jet.pos.z);
    jetShadow.scale.setScalar(sSize);
    jetShadow.material.opacity = sOp;
    jetShadow.visible = sOp > 0.02 && !state.exploding;
  } else {
    jetShadow.visible = false;
  }

  /* ---------- camera ---------- */
  const camDist = 24;
  const camHeight = 9;
  const camTarget = new THREE.Vector3(
    jet.pos.x + Math.sin(jet.yaw) * camDist,
    jet.pos.y + camHeight,
    jet.pos.z + Math.cos(jet.yaw) * camDist
  );

  if (state.shake > 0) {
    state.shake = Math.max(0, state.shake - dt * 55);
    const s = state.shake * 0.25;
    camTarget.x += rand(-s, s);
    camTarget.y += rand(-s, s);
    camTarget.z += rand(-s, s);
  }

  camera.position.lerp(camTarget, 1 - Math.exp(-8 * dt));

  const fwd = new THREE.Vector3(
    -Math.sin(jet.yaw) * Math.cos(jet.pitch),
    Math.sin(jet.pitch),
    -Math.cos(jet.yaw) * Math.cos(jet.pitch)
  );
  const lookAt = jet.pos.clone().addScaledVector(fwd, 30);
  lookAt.y += 3;
  camera.lookAt(lookAt);
  camera.rotateZ(jet.roll * 0.14);

  skyMesh.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(sunDir, 4200);

  water.position.x = jet.pos.x;
  water.position.z = jet.pos.z;

  for (const c of clouds) {
    if (Math.abs(c.position.z - jet.pos.z) > 3800 ||
        Math.abs(c.position.x - jet.pos.x) > 3800) {
      c.position.set(
        jet.pos.x + rand(-3000, 3000),
        rand(700, 1700),
        jet.pos.z + rand(-3000, 3000)
      );
      c.scale.setScalar(rand(0.9, 2.1));
    }
  }

  updateExplosion(dt);

  /* ---------- POI discovery ---------- */
  if (playing) {
    const ccx = Math.floor(jet.pos.x / CHUNK_SIZE);
    const ccz = Math.floor(jet.pos.z / CHUNK_SIZE);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        const key = (ccx+dx) + ',' + (ccz+dz);
        const data = chunkMeshes.get(key);
        if (!data) continue;

        if (data.villages) {
          for (const v of data.villages) {
            const vkey = 'v:' + Math.round(v.x) + ':' + Math.round(v.z);
            if (visitedPOIs.has(vkey)) continue;
            const ddx = jet.pos.x - v.x;
            const ddz = jet.pos.z - v.z;
            if (ddx*ddx + ddz*ddz < 240*240) {
              visitedPOIs.add(vkey);
              state.poiFound++;
              state.multiplier = Math.min(8, state.multiplier + 1);
              state.score += 200 * state.multiplier;
            }
          }
        }

        if (data.cities) {
          for (const c of data.cities) {
            const ckey = 'c:' + Math.round(c.x) + ':' + Math.round(c.z);
            if (visitedPOIs.has(ckey)) continue;
            const ddx = jet.pos.x - c.x;
            const ddz = jet.pos.z - c.z;
            if (ddx*ddx + ddz*ddz < 320*320) {
              visitedPOIs.add(ckey);
              state.poiFound++;
              state.multiplier = Math.min(10, state.multiplier + 2);
              state.score += 600 * state.multiplier;
            }
          }
        }
      }
    }
  }

  const budget = playing ? 2 : 4;
  updateChunks(jet.pos.x, jet.pos.z, budget);
}

/* =========================================================
   LOOP
   ========================================================= */
let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);

  update(dt);
  renderer.render(scene, camera);
  updateHUD(false);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
}
window.addEventListener('resize', onResize);

function boot() {
  onResize();
  const th = Math.max(terrainHeight(0, 0), 0);
  jet.pos.set(0, th + 380, 0);

  const order = [];
  for (let dx = -2; dx <= 2; dx++)
    for (let dz = -2; dz <= 2; dz++)
      order.push({ cx: dx, cz: dz, d: dx*dx + dz*dz });
  order.sort((a, b) => a.d - b.d);
  for (const { cx, cz } of order) {
    const key = cx + ',' + cz;
    if (!chunkMeshes.has(key)) {
      const data = buildChunk(cx, cz);
      chunkMeshes.set(key, data);
      scene.add(data.mesh);
    }
  }

  subtitle.innerHTML =
    `Open-world low-poly flight.<br>Follow the roads. Discover villages and cities.` +
    `<br><span style="font-size:11px;opacity:.8">BEST SCORE: <b style="color:#ffd35c">${state.best}</b></span>`;

  updateHUD(true);
  update(0.016);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

boot();
</script>
