<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
  .panel{position:absolute;padding:10px 16px 12px;border-radius:14px;

  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;

  /* ---------- Throttle ---------- */
  #thrZone{position:fixed;right:26px;bottom:26px;width:66px;height:230px;

    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:8;touch-action:none;pointer-events:none;overflow:hidden;
    transition:opacity .3s ease}
  #thrFill{position:absolute;left:0;right:0;bottom:0;height:60%;

  #thrKnob{position:absolute;left:4px;right:4px;bottom:60%;height:14px;
    margin-bottom:-7px;border-radius:7px;

    box-shadow:0 0 18px rgba(110,220,255,.9);transition:bottom .04s linear}
  #thrLabel{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    font-size:8px;letter-spacing:2px;color:rgba(140,220,255,.7);
    font-weight:700;pointer-events:none;white-space:nowrap}

  /* ---------- Overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:16px;padding:28px;
    background:radial-gradient(ellipse at 50% 42%,rgba(8,26,48,.62),rgba(3,8,16,.94));

  #overlay.hide{opacity:0;pointer-events:none}
  h1{font-size:clamp(32px,8.5vw,68px);letter-spacing:.11em;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#ffffff 22%,#4fe3ff 100%);

    filter:drop-shadow(0 0 30px rgba(79,227,255,.6))}
  #subtitle{font-size:clamp(12px,3vw,15px);color:#a9cfe2;letter-spacing:.1em;
    max-width:540px;line-height:1.8;font-weight:600}
  button{pointer-events:auto;cursor:pointer;border:none;padding:15px 46px;border-radius:99px;
    font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.18em;color:#04121d;
    background:linear-gradient(180deg,#9af3ff,#33c6ff);
    box-shadow:0 0 36px rgba(79,227,255,.55),0 10px 26px rgba(0,0,0,.45);
    transition:transform .12s ease,box-shadow .12s ease}
  button:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 56px rgba(79,227,255,.9)}
  button:active{transform:scale(.97)}
  .hint{font-size:11px;color:#87aec2;letter-spacing:.06em;line-height:2.2;max-width:600px}
  kbd{background:rgba(79,227,255,.12);border:1px solid rgba(79,227,255,.36);
    border-radius:6px;padding:2px 7px;font-family:inherit;font-size:10px;
    color:#c7f1ff;font-weight:700;margin:0 1px}

<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="panel" id="pLeft">

<script type="module">
import * as THREE from 'three';

/* =========================================================
   UTILITIES
   ========================================================= */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function chunkSeed(cx, cz) {
  let h = Math.imul(cx, 374761393) + Math.imul(cz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* =========================================================
   HASH / NOISE / TERRAIN
   ========================================================= */
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y, oct) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * freq, y * freq);
    norm += amp; amp *= 0.5; freq *= 2.0;
  }
  return sum / norm;
}
function terrainHeight(x, z) {
  const base = fbm(x * 0.0016, z * 0.0016, 5);
  let h = (base - 0.45) * 340;
  const lake = fbm(x * 0.00075 + 137.3, z * 0.00075 + 91.7, 3);
  if (lake < 0.44) {
    const t = Math.min(1, (0.44 - lake) / 0.16);
    h = h * (1 - t) - 58 * t;
  }
  const mn = fbm(x * 0.00055 + 512.1, z * 0.00055 + 733.9, 4);
  let mask = (mn - 0.53) / 0.47;
  if (mask > 0) {
    mask = Math.min(1, mask);
    const ridge = fbm(x * 0.0034 + 77.7, z * 0.0034 + 21.3, 4);
    h += mask * mask * (650 + 950 * ridge * ridge);
  }
  return h;
}

/* =========================================================
   PALETTE
   ========================================================= */
const C_MUD    = new THREE.Color(0x3e5a4a);
const C_SAND   = new THREE.Color(0xd9c98d);
const C_GRASS1 = new THREE.Color(0x74bd4e);
const C_GRASS2 = new THREE.Color(0x4f9539);
const C_FOREST = new THREE.Color(0x36702d);
const C_ROCK   = new THREE.Color(0x7a7166);
const C_ROCK2  = new THREE.Color(0x585250);
const C_SNOW   = new THREE.Color(0xeef5ff);

function pickColor(y, ny, out) {
  if (y < -2)          out.copy(C_MUD);
  else if (y < 4)      out.copy(C_SAND);
  else if (ny < 0.62)  out.copy(C_ROCK);
  else if (y < 170)    out.copy(C_GRASS1).lerp(C_GRASS2, (y - 4) / 166);
  else if (y < 340)    out.copy(C_GRASS2).lerp(C_FOREST, (y - 170) / 170);
  else if (y < 520)    out.copy(C_FOREST).lerp(C_ROCK,   (y - 340) / 180);
  else if (y < 700)    out.copy(C_ROCK).lerp(C_ROCK2,    (y - 520) / 180);
  else                 out.copy(C_SNOW);
  const v = 0.93 + Math.random() * 0.14;
  out.r *= v; out.g *= v; out.b *= v;
}

/* =========================================================
   RENDERER / SCENE
   ========================================================= */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xbcdcf2);
scene.fog = new THREE.Fog(FOG_COLOR, 1000, 3000);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.6, 9000);
camera.position.set(0, 300, 22);

/* ---------- Sky ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x1e5da8) },
    midColor: { value: new THREE.Color(0xbcdcf2) },
    botColor: { value: new THREE.Color(0x8fb8d8) },
    exponent: { value: 0.72 }
  },
  vertexShader: `
    varying vec3 vW;
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.0);
      vW = wp.xyz - cameraPosition;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 topColor, midColor, botColor;
    uniform float exponent;
    varying vec3 vW;
    void main(){
      float h = normalize(vW).y;
      vec3 c;
      if (h > 0.0) c = mix(midColor, topColor, pow(h, exponent));
      else         c = mix(midColor, botColor, pow(-h, 0.55));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(6000, 24, 16), skyMat);
skyMesh.renderOrder = -1000; skyMesh.frustumCulled = false;
scene.add(skyMesh);

/* ---------- Lights ---------- */
const sunDir = new THREE.Vector3(0.35, 0.58, 0.74).normalize();
scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x46603a, 0.85));
const sun = new THREE.DirectionalLight(0xfff2d6, 1.45);
sun.position.copy(sunDir).multiplyScalar(1500);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9dc4ff, 0.35);
fill.position.set(-0.5, 0.3, -0.8).multiplyScalar(1000);
scene.add(fill);

/* ---------- Sun sprite ---------- */
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(128,128,0,128,128,128);
  grd.addColorStop(0,'rgba(255,255,245,1)');
  grd.addColorStop(0.13,'rgba(255,248,205,0.92)');
  grd.addColorStop(0.36,'rgba(255,208,130,0.34)');
  grd.addColorStop(1,'rgba(255,160,60,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(cv);
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(), blending: THREE.AdditiveBlending,
  depthWrite: false, depthTest: false, transparent: true
}));
sunSprite.scale.setScalar(2200);
sunSprite.renderOrder = -900;
scene.add(sunSprite);

/* ---------- Water ---------- */
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(26000, 26000, 1, 1),
  new THREE.MeshPhongMaterial({
    color: 0x2c7fb8, specular: 0xbfe8ff, shininess: 110,
    transparent: true, opacity: 0.86, flatShading: true
  })
);
water.rotation.x = -Math.PI / 2;
scene.add(water);

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
const _tmpColor = new THREE.Color();
function setColor(geo, hex, variance, rng) {
  _tmpColor.set(hex);
  const v = 1 + (rng() - 0.5) * variance * 2;
  const r = _tmpColor.r * v, g = _tmpColor.g * v, b = _tmpColor.b * v;
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i*3] = r; arr[i*3+1] = g; arr[i*3+2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
function mergeGeos(geos) {
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}

/* =========================================================
   CHUNKS
   ========================================================= */
const CHUNK_SIZE = 520;
const CHUNK_SEG  = 14;
const VIEW_R     = 4;
const chunkMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const chunkMeshes = new Map();
const chunkVillages = new Map();

/* ---------- House ---------- */
function addHouse(geos, x, y, z, rot, rng) {
  const w  = 7 + rng() * 4;
  const d  = 8 + rng() * 4;
  const hh = 6 + rng() * 4;
  const wallCol = [0xe8dcc0, 0xdfc9a8, 0xf0e4c8, 0xd8cdb4][Math.floor(rng()*4)];
  const roofCol = [0xa8453a, 0x8f4a3a, 0x6e4a3a, 0xb5503f][Math.floor(rng()*4)];

  const body = new THREE.BoxGeometry(w, hh, d).toNonIndexed();
  setColor(body, wallCol, 0.055, rng);
  body.translate(0, hh/2, 0);

  const roof = new THREE.ConeGeometry(Math.max(w, d) * 0.76, hh * 0.72, 4).toNonIndexed();
  setColor(roof, roofCol, 0.06, rng);
  roof.rotateY(Math.PI / 4);
  roof.translate(0, hh + hh * 0.36, 0);

  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), rot),
    new THREE.Vector3(1,1,1)
  );
  body.applyMatrix4(m); roof.applyMatrix4(m);
  geos.push(body, roof);
}

/* ---------- Tower / windmill ---------- */
function addTower(geos, x, y, z, rng) {
  const tw = new THREE.CylinderGeometry(2.8, 3.8, 20, 6).toNonIndexed();
  setColor(tw, 0xd4bf98, 0.08, rng);
  tw.translate(x, y + 10, z);
  geos.push(tw);

  const roof = new THREE.ConeGeometry(4.6, 6, 6).toNonIndexed();
  setColor(roof, 0x8a4030, 0.08, rng);
  roof.translate(x, y + 20 + 3, z);
  geos.push(roof);

  // small window band
  const band = new THREE.CylinderGeometry(3.4, 3.4, 1.5, 6).toNonIndexed();
  setColor(band, 0x4a3a2e, 0.05, rng);
  band.translate(x, y + 15, z);
  geos.push(band);
}

/* ---------- Village ---------- */
function addVillage(geos, villages, cx, cz, rng) {
  const vh = terrainHeight(cx, cz);
  if (vh < 5 || vh > 350) return;

  let maxD = 0;
  for (let a = 0; a < 8; a++) {
    const ang = (a / 8) * Math.PI * 2;
    const px = cx + Math.cos(ang) * 90;
    const pz = cz + Math.sin(ang) * 90;
    maxD = Math.max(maxD, Math.abs(terrainHeight(px, pz) - vh));
  }
  if (maxD > 40) return;

  // central plaza
  const plaza = new THREE.CircleGeometry(13, 8).toNonIndexed();
  plaza.rotateX(-Math.PI / 2);
  plaza.translate(cx, vh + 0.6, cz);
  setColor(plaza, 0x8a6a4a, 0.1, rng);
  geos.push(plaza);

  // houses in a ring
  const nHouses = 5 + Math.floor(rng() * 4);
  for (let i = 0; i < nHouses; i++) {
    const ang = (i / nHouses) * Math.PI * 2 + rng() * 0.4;
    const rad = 24 + rng() * 26;
    const hx = cx + Math.cos(ang) * rad;
    const hz = cz + Math.sin(ang) * rad;
    const hh = terrainHeight(hx, hz);
    if (hh < 3) continue;
    addHouse(geos, hx, hh, hz, ang + Math.PI / 2 + rng() * 0.4, rng);
  }

  // tower
  if (rng() < 0.55) addTower(geos, cx, vh, cz, rng);

  // fields (flat colored quads)
  const nFields = 2 + Math.floor(rng() * 3);
  for (let i = 0; i < nFields; i++) {
    const ang = rng() * Math.PI * 2;
    const rad = 55 + rng() * 45;
    const fx = cx + Math.cos(ang) * rad;
    const fz = cz + Math.sin(ang) * rad;
    const fh = terrainHeight(fx, fz);
    if (fh < 3 || Math.abs(fh - vh) > 22) continue;
    const fw = 16 + rng() * 18;
    const fd = 22 + rng() * 16;
    const field = new THREE.PlaneGeometry(fw, fd, 1, 1).toNonIndexed();
    field.rotateX(-Math.PI / 2);
    field.rotateY(rng() * Math.PI);
    field.translate(fx, fh + 0.4, fz);
    setColor(field, [0xb5c060, 0x8a9a45, 0x9c7a45, 0xa8b854][Math.floor(rng()*4)], 0.1, rng);
    geos.push(field);
  }

  villages.push({ x: cx, z: cz });
}

/* ---------- Props ---------- */
function buildProps(cx, cz, geos, villages) {
  const rng = mulberry32(chunkSeed(cx, cz));
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;

  /* trees */
  const treeCount = 10 + Math.floor(rng() * 14);
  for (let i = 0; i < treeCount; i++) {
    const x = ox + (rng() - 0.5) * CHUNK_SIZE * 0.95;
    const z = oz + (rng() - 0.5) * CHUNK_SIZE * 0.95;
    const h = terrainHeight(x, z);
    if (h < 5 || h > 340) continue;
    const dx = terrainHeight(x + 16, z) - terrainHeight(x - 16, z);
    const dz = terrainHeight(x, z + 16) - terrainHeight(x, z - 16);
    if (Math.hypot(dx, dz) / 32 > 0.85) continue;

    const s = 0.75 + rng() * 0.9;
    const trunkH = 4 * s;
    const trunk = new THREE.BoxGeometry(1.3 * s, trunkH, 1.3 * s).toNonIndexed();
    setColor(trunk, 0x5a4530, 0.14, rng);
    trunk.translate(x, h + trunkH/2, z);
    geos.push(trunk);

    if (rng() < 0.6) {
      // pine
      const leafH = 12 * s;
      const leaf = new THREE.ConeGeometry(4.2 * s, leafH, 5).toNonIndexed();
      setColor(leaf, 0x2f7a3a, 0.18, rng);
      leaf.translate(x, h + trunkH + leafH/2 - 1, z);
      geos.push(leaf);
    } else {
      // round tree
      const r = 4.5 * s;
      const ball = new THREE.IcosahedronGeometry(r, 0).toNonIndexed();
      setColor(ball, 0x3f8f3a, 0.16, rng);
      ball.translate(x, h + trunkH + r * 0.7, z);
      geos.push(ball);
    }
  }

  /* rocks */
  const rockCount = 3 + Math.floor(rng() * 5);
  for (let i = 0; i < rockCount; i++) {
    const x = ox + (rng() - 0.5) * CHUNK_SIZE;
    const z = oz + (rng() - 0.5) * CHUNK_SIZE;
    const h = terrainHeight(x, z);
    if (h < 0) continue;
    const s = 1 + rng() * 3;
    const rock = new THREE.IcosahedronGeometry(s, 0).toNonIndexed();
    setColor(rock, 0x808078, 0.15, rng);
    rock.translate(x, h + s * 0.4, z);
    geos.push(rock);
  }

  /* village */
  if (rng() < 0.42) {
    const vx = ox + (rng() - 0.5) * CHUNK_SIZE * 0.5;
    const vz = oz + (rng() - 0.5) * CHUNK_SIZE * 0.5;
    addVillage(geos, villages, vx, vz, rng);
  }
}

/* ---------- Build chunk ---------- */
function buildChunk(cx, cz) {
  const geos = [];
  const villages = [];

  const size = CHUNK_SIZE, seg = CHUNK_SEG;
  const tg = new THREE.PlaneGeometry(size, size, seg, seg);
  tg.rotateX(-Math.PI / 2);
  tg.translate(cx * size, 0, cz * size);

  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    tp.setY(i, terrainHeight(tp.getX(i), tp.getZ(i)));
  }

  const terrain = tg.toNonIndexed();
  tg.dispose();

  const tpos = terrain.attributes.position;
  const cnt = tpos.count;
  const colors = new Float32Array(cnt * 3);
  const col = new THREE.Color();

  for (let f = 0; f < cnt; f += 3) {
    const ax = tpos.getX(f),     ay = tpos.getY(f),     az = tpos.getZ(f);
    const bx = tpos.getX(f + 1), by = tpos.getY(f + 1), bz = tpos.getZ(f + 1);
    const cx2 = tpos.getX(f + 2), cy2 = tpos.getY(f + 2), cz2 = tpos.getZ(f + 2);

    const avgY = (ay + by + cy2) / 3;
    const e1x = bx - ax, e1y = by - ay, e1z = bz - az;
    const e2x = cx2 - ax, e2y = cy2 - ay, e2z = cz2 - az;
    let nx = e1y * e2z - e1z * e2y;
    let ny = e1z * e2x - e1x * e2z;
    let nz = e1x * e2y - e1y * e2x;
    const len = Math.hypot(nx, ny, nz) || 1;
    ny = Math.abs(ny / len);
    pickColor(avgY, ny, col);
    for (let k = 0; k < 3; k++) {
      colors[(f+k)*3]     = col.r;
      colors[(f+k)*3 + 1] = col.g;
      colors[(f+k)*3 + 2] = col.b;
    }
  }
  terrain.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geos.push(terrain);

  buildProps(cx, cz, geos, villages);

  const merged = mergeGeos(geos);
  merged.computeBoundingSphere();
  const mesh = new THREE.Mesh(merged, chunkMat);
  mesh.frustumCulled = true;

  return { mesh, villages };
}

/* ---------- Streaming ---------- */
function updateChunks(px, pz, budget) {
  const ccx = Math.floor(px / CHUNK_SIZE);
  const ccz = Math.floor(pz / CHUNK_SIZE);

  for (const [key, data] of chunkMeshes) {
    const comma = key.indexOf(',');
    const cx = +key.slice(0, comma);
    const cz = +key.slice(comma + 1);
    if (Math.abs(cx - ccx) > VIEW_R + 1 || Math.abs(cz - ccz) > VIEW_R + 1) {
      scene.remove(data.mesh);
      data.mesh.geometry.dispose();
      chunkMeshes.delete(key);
    }
  }

  const missing = [];
  const R = VIEW_R + 0.5;
  for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
    for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
      if (dx*dx + dz*dz > R*R) continue;
      const cx = ccx + dx, cz = ccz + dz;
      const key = cx + ',' + cz;
      if (!chunkMeshes.has(key)) missing.push({ cx, cz, d: dx*dx + dz*dz });
    }
  }
  missing.sort((a, b) => a.d - b.d);

  const n = Math.min(budget, missing.length);
  for (let i = 0; i < n; i++) {
    const { cx, cz } = missing[i];
    const key = cx + ',' + cz;
    if (chunkMeshes.has(key)) continue;
    const data = buildChunk(cx, cz);
    chunkMeshes.set(key, data);
    scene.add(data.mesh);
  }
}

/* =========================================================
   JET MODEL
   ========================================================= */
function createJet() {
  const g = new THREE.Group();
  const D = THREE.DoubleSide;
  const bodyMat  = new THREE.MeshLambertMaterial({ color: 0xdfe8f2, flatShading: true, side: D });
  const darkMat  = new THREE.MeshLambertMaterial({ color: 0x39424f, flatShading: true, side: D });
  const redMat   = new THREE.MeshLambertMaterial({ color: 0xe2453f, flatShading: true, side: D });
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x2ab8ff, flatShading: true, emissive: 0x0a2d44, side: D });

  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 1.1, 7.4, 7), bodyMat);
  fus.rotation.x = Math.PI / 2;
  g.add(fus);

  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.82, 3.0, 7), bodyMat);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -5.2;
  g.add(nose);

  const cock = new THREE.Mesh(new THREE.SphereGeometry(0.72, 7, 5), glassMat);
  cock.scale.set(1, 0.86, 1.9);
  cock.position.set(0, 0.6, -1.5);
  g.add(cock);

  function makeWing(sign) {
    const s = new THREE.Shape();
    s.moveTo(0, 1.7);
    s.lineTo(sign * 5.6, 1.0);
    s.lineTo(sign * 5.6, -0.9);
    s.lineTo(0, -1.5);
    s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.22, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, -0.11, 0);
    return new THREE.Mesh(geo, bodyMat);
  }
  g.add(makeWing(1), makeWing(-1));

  [-5.6, 5.6].forEach(x => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 2.0), redMat);
    tip.position.set(x, 0.05, 0.05);
    g.add(tip);
  });

  const fs = new THREE.Shape();
  fs.moveTo(0, 0); fs.lineTo(1.9, 0); fs.lineTo(1.45, 2.5); fs.lineTo(0.45, 2.5);
  fs.closePath();
  const finGeo = new THREE.ExtrudeGeometry(fs, { depth: 0.18, bevelEnabled: false });
  finGeo.rotateY(-Math.PI / 2);
  finGeo.translate(-0.09, 0.4, 1.55);
  g.add(new THREE.Mesh(finGeo, redMat));

  [1, -1].forEach(sgn => {
    const st = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 1.1), bodyMat);
    st.position.set(sgn * 1.55, 0, 2.75);
    g.add(st);
  });

  [-0.95, 0.95].forEach(x => {
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.54, 2.4, 7), darkMat);
    eng.rotation.x = Math.PI / 2;
    eng.position.set(x, -0.08, 2.25);
    g.add(eng);
  });

  const flameMat = new THREE.MeshBasicMaterial({
    color: 0x6fe0ff, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const flames = [];
  [-0.95, 0.95].forEach(x => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.44, 2.6, 7), flameMat);
    f.rotation.x = Math.PI / 2;
    f.position.set(x, -0.08, 4.0);
    g.add(f); flames.push(f);
  });

  g.userData.flames = flames;
  g.userData.flameMat = flameMat;
  return g;
}

const jetGroup = createJet();
jetGroup.rotation.order = 'YXZ';
scene.add(jetGroup);

const cloudMat = new THREE.MeshLambertMaterial({
  color: 0xffffff, flatShading: true, transparent: true, opacity: 0.92

function createCloudGeo() {
  const geos = [];
  const n = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const s = 40 + Math.random() * 55;
    const g = new THREE.IcosahedronGeometry(s, 0);
    g.translate((Math.random()-0.5)*150, (Math.random()-0.5)*45, (Math.random()-0.5)*110);
    geos.push(g);
  }
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.computeVertexNormals();
  return out;
}

/* =========================================================
   EXPLOSION
   ========================================================= */
const MAX_SPARKS = 120;
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(MAX_SPARKS * 3);
const sparkCol = new Float32Array(MAX_SPARKS * 3);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
const sparkMat = new THREE.PointsMaterial({
  size: 5, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
sparkPoints.frustumCulled = false;
scene.add(sparkPoints);

const sparks = [];
for (let i = 0; i < MAX_SPARKS; i++) {
  sparks.push({ x:0,y:0,z:0, vx:0,vy:0,vz:0, life:0, maxLife:1, r:1,g:1,b:1 });
  sparkPos[i*3+1] = -99999;
}

const fireballMat = new THREE.MeshBasicMaterial({
  color: 0xffaa33, transparent: true, opacity: 1,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const fireball = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), fireballMat);
fireball.visible = false;
fireball.frustumCulled = false;
scene.add(fireball);

let fireballT = 0;

function spawnExplosion(pos) {
  fireball.position.copy(pos);
  fireball.scale.setScalar(3);
  fireballMat.opacity = 1;
  fireball.visible = true;
  fireballT = 0;

  for (let i = 0; i < MAX_SPARKS; i++) {
    const s = sparks[i];
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = rand(30, 220);
    s.x = pos.x; s.y = pos.y; s.z = pos.z;
    s.vx = Math.sin(phi) * Math.cos(theta) * speed;
    s.vy = Math.cos(phi) * speed;
    s.vz = Math.sin(phi) * Math.sin(theta) * speed;
    s.life = rand(0.6, 1.6);
    s.maxLife = s.life;

    // color: bright white/yellow at start
    const c = Math.random();
    if (c < 0.4)      { s.r = 1.0; s.g = 1.0; s.b = 0.85; }
    else if (c < 0.75){ s.r = 1.0; s.g = 0.55; s.b = 0.15; }
    else              { s.r = 1.0; s.g = 0.25; s.b = 0.1; }
  }
}

function updateExplosion(dt) {
  if (fireball.visible) {
    fireballT += dt;
    const t = fireballT / 0.9;
    if (t >= 1) {
      fireball.visible = false;
    } else {
      fireball.scale.setScalar(3 + t * 42);
      fireballMat.opacity = 1 - t;
    }
  }

  let anyAlive = false;
  for (let i = 0; i < MAX_SPARKS; i++) {
    const s = sparks[i];
    if (s.life <= 0) {
      if (sparkPos[i*3+1] > -90000) sparkPos[i*3+1] = -99999;
      continue;
    }
    anyAlive = true;
    s.life -= dt;
    if (s.life <= 0) {
      sparkPos[i*3+1] = -99999;
      continue;
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.vx *= Math.exp(-1.8 * dt);
    s.vy *= Math.exp(-1.8 * dt);
    s.vz *= Math.exp(-1.8 * dt);
    s.vy -= 60 * dt;

    const fade = s.life / s.maxLife;
    const fl = 0.4 + fade * 0.6;
    sparkPos[i*3]     = s.x;
    sparkPos[i*3 + 1] = s.y;
    sparkPos[i*3 + 2] = s.z;
    sparkCol[i*3]     = s.r * fl;
    sparkCol[i*3 + 1] = s.g * fl;
    sparkCol[i*3 + 2] = s.b * fl;
  }
  if (anyAlive) {
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;
  }
}

/* =========================================================
   INPUT: JOYSTICK / THROTTLE
   ========================================================= */
const joyEl  = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
const thrEl  = document.getElementById('thrZone');
const thrFill = document.getElementById('thrFill');
const thrKnob = document.getElementById('thrKnob');

const joy = { id: null, x: 0, y: 0, cx: 0, cy: 0, radius: 55 };
const thr = { id: null, value: 0.6 };

function refreshControlRects() {
  const jr = joyEl.getBoundingClientRect();
  joy.cx = jr.left + jr.width / 2;
  joy.cy = jr.top + jr.height / 2;
  joy.radius = jr.width * 0.36;
}
function updateJoyKnob() {
  joyKnob.style.transform = `translate(${joy.x * joy.radius}px, ${-joy.y * joy.radius}px)`;
}
function updateThrVisual() {
  const pct = thr.value * 100;
  thrFill.style.height = pct + '%';
  thrKnob.style.bottom = pct + '%';
}
refreshControlRects();
updateThrVisual();
window.addEventListener('resize', refreshControlRects);

window.addEventListener('pointerdown', e => {
  if (state.phase !== 'play') return;
  const x = e.clientX, y = e.clientY;

  // Joystick hit
  const jr = joyEl.getBoundingClientRect();
  if (joy.id === null &&
      x >= jr.left - 10 && x <= jr.right + 10 &&
      y >= jr.top - 10 && y <= jr.bottom + 10) {
    joy.id = e.pointerId;
    const dx = x - joy.cx;
    const dy = y - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) {
      const k = Math.min(d, joy.radius) / d;
      joy.x = clamp(dx * k / joy.radius, -1, 1);
      joy.y = clamp(-dy * k / joy.radius, -1, 1);
    }
    updateJoyKnob();
    return;
  }

  // Throttle hit
  const tr = thrEl.getBoundingClientRect();
  if (thr.id === null &&
      x >= tr.left - 14 && x <= tr.right + 14 &&
      y >= tr.top - 10 && y <= tr.bottom + 10) {
    thr.id = e.pointerId;
    thr.value = clamp(1 - (y - tr.top) / tr.height, 0, 1);
    updateThrVisual();
  }
}, { passive: false });

window.addEventListener('pointermove', e => {
  if (joy.id === e.pointerId) {
    const dx = e.clientX - joy.cx;
    const dy = e.clientY - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) {
      const k = Math.min(d, joy.radius) / d;
      joy.x = clamp(dx * k / joy.radius, -1, 1);
      joy.y = clamp(-dy * k / joy.radius, -1, 1);
    }
    updateJoyKnob();
  }
  if (thr.id === e.pointerId) {
    const tr = thrEl.getBoundingClientRect();
    thr.value = clamp(1 - (e.clientY - tr.top) / tr.height, 0, 1);
    updateThrVisual();
  }
}, { passive: false });

function endPointer(e) {
  if (joy.id === e.pointerId) {
    joy.id = null; joy.x = 0; joy.y = 0;
    updateJoyKnob();
  }
  if (thr.id === e.pointerId) {
    thr.id = null;
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* ---------- Keyboard ---------- */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if ((k === ' ' || k === 'enter') && state.phase !== 'play') startGame();
}, { passive: false });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  joy.id = null; joy.x = 0; joy.y = 0; thr.id = null;
  updateJoyKnob();
});

startBtn.addEventListener('click', startGame);

function getJoystickInput() {
  let ix = joy.x, iy = joy.y;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy += 1;
  if (keys['s'] || keys['arrowdown'])  iy -= 1;
  ix = clamp(ix, -1, 1); iy = clamp(iy, -1, 1);
  const m = Math.hypot(ix, iy);
  if (m > 1) { ix /= m; iy /= m; }
  return { x: ix, y: iy };
}

/* =========================================================
   GAME FLOW
   ========================================================= */
function startGame() {
  state.phase = 'play';
  state.score = 0;
  state.multiplier = 1;
  state.travel = 0;
  state.invuln = 1.2;
  state.shake = 0;
  state.exploding = false;
  state.villagesFound = 0;
  visitedVillages.clear();

  const th = Math.max(terrainHeight(0, 0), 0);
  jet.pos.set(0, th + 400, 0);
  jet.yaw = 0; jet.pitch = 0; jet.roll = 0;
  jet.vy = 0; jet.speed = 220;
  jet.boost = 100;
  jet.throttle = 0.6;
  thr.value = 0.6;
  updateThrVisual();

  jetGroup.visible = true;

  // snap camera
  camera.position.set(
    jet.pos.x + Math.sin(jet.yaw) * 22,
    jet.pos.y + 8,
    jet.pos.z + Math.cos(jet.yaw) * 22
  );

  overlay.classList.add('hide');
  updateHUD(true);
}

function gameOver() {
  state.phase = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem('skyrunner3d_best', String(state.best)); } catch (e) {}
  }
  title.textContent = 'FLIGHT ENDED';
  subtitle.innerHTML =
    `SCORE <b style="color:#4fe3ff">${state.score}</b>` +
    ` &nbsp;·&nbsp; BEST <b style="color:#ffd35c">${state.best}</b>` +
    `<br><span style="font-size:11px;opacity:.75">Distance: ${(state.travel/1000).toFixed(2)} km &nbsp;·&nbsp; Villages: ${state.villagesFound}</span>`;
  startBtn.textContent = 'FLY AGAIN';
  overlay.classList.remove('hide');
  updateHUD(true);
}

function crash() {
  if (state.exploding) return;
  state.exploding = true;

  spawnExplosion(jet.pos.clone());
  jetGroup.visible = false;

  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 240);

  state.shake = 32;
  state.multiplier = 1;

  setTimeout(() => {
    // respawn
    const x = jet.pos.x + rand(-250, 250);
    const z = jet.pos.z + rand(-250, 250);
    const th = Math.max(terrainHeight(x, z), 0);
    jet.pos.set(x, th + 450, z);
    jet.yaw = jet.yaw + rand(-0.4, 0.4);
    jet.pitch = 0; jet.roll = 0; jet.vy = 0;
    jet.speed = 220;
    jetGroup.visible = true;
    state.invuln = 2.2;
    state.exploding = false;

    camera.position.set(
      jet.pos.x + Math.sin(jet.yaw) * 22,
      jet.pos.y + 8,
      jet.pos.z + Math.cos(jet.yaw) * 22
    );
  }, 1700);
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  const playing = state.phase === 'play' && !state.exploding;

  /* ---------- throttle keys ---------- */
  if (state.phase === 'play') {
    if (keys['e'] || keys['+'] || keys['=']) {
      thr.value = Math.min(1, thr.value + dt * 0.55);
      updateThrVisual();
    }
    if (keys['q'] || keys['-']) {
      thr.value = Math.max(0, thr.value - dt * 0.55);
      updateThrVisual();
    }
  }
  jet.throttle = thr.value;

  /* ---------- flight physics ---------- */
  if (playing) {
    const input = getJoystickInput();

    const PITCH_MAX = 0.75;
    const ROLL_MAX  = 1.15;
    const targetPitch = input.y * PITCH_MAX;
    const targetRoll  = input.x * ROLL_MAX;

    const pk = 1 - Math.exp(-4.5 * dt);
    const rk = 1 - Math.exp(-6.0 * dt);
    jet.pitch += (targetPitch - jet.pitch) * pk;
    jet.roll  += (targetRoll  - jet.roll)  * rk;

    /* speed from throttle + boost */
    const boosting = !!keys['shift'] && jet.boost > 1;
    const targetSpeed = (140 + jet.throttle * 360) * (boosting ? 1.65 : 1);
    jet.speed += (targetSpeed - jet.speed) * (1 - Math.exp(-2.2 * dt));

    if (boosting) jet.boost = Math.max(0, jet.boost - 26 * dt);
    else          jet.boost = Math.min(100, jet.boost + 14 * dt);

    /* yaw from banked turn (positive roll = right bank = turn right) */
    const turnAuthority = clamp(jet.speed / 280, 0.35, 1.6);
    jet.yaw -= jet.roll * 1.55 * turnAuthority * dt;

    /* vertical velocity from pitch + gravity when slow */
    const liftLoss = Math.max(0, 1 - jet.speed / 190);
    const targetVy = Math.sin(jet.pitch) * jet.speed * 1.5 - liftLoss * 220;
    jet.vy += (targetVy - jet.vy) * (1 - Math.exp(-3.2 * dt));
    jet.vy = clamp(jet.vy, -520, 520);

    /* horizontal movement along yaw */
    const horiz = jet.speed * Math.cos(jet.pitch * 0.75);
    const fwdX = -Math.sin(jet.yaw);
    const fwdZ = -Math.cos(jet.yaw);

    jet.pos.x += fwdX * horiz * dt;
    jet.pos.z += fwdZ * horiz * dt;
    jet.pos.y += jet.vy * dt;

    /* ceiling */
    if (jet.pos.y > 2600) { jet.pos.y = 2600; jet.vy = Math.min(jet.vy, 0); }

    /* terrain / water collision */
    if (state.invuln > 0) state.invuln -= dt;
    const groundH = Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0);
    if (jet.pos.y < groundH + 9 && state.invuln <= 0) {
      crash();
    }

    /* score & travel */
    const dist = jet.speed * dt;
    state.travel += dist;
    state.score += Math.floor(dist * 0.05 * state.multiplier);
  } else if (state.phase === 'menu' || state.phase === 'over') {
    // idle autopilot cruise for menu background
    jet.pos.z -= 200 * dt;
    jet.pos.x += (Math.sin(performance.now() * 0.00013) * 180 - jet.pos.x) * (1 - Math.exp(-1.2 * dt));
    jet.pos.y += (Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0) + 400 - jet.pos.y) * (1 - Math.exp(-1.2 * dt));
    jet.pitch *= Math.exp(-2 * dt);
    jet.roll *= Math.exp(-2 * dt);
    jet.vy = 0;
    state.travel += 200 * dt;
  }

  /* ---------- jet visuals ---------- */
  jetGroup.position.copy(jet.pos);
  jetGroup.rotation.set(jet.pitch, jet.yaw, -jet.roll);

  const boosting = playing && !!keys['shift'] && jet.boost > 1;
  const fm = jetGroup.userData.flameMat;
  const flen = 0.75 + Math.random() * 0.3 + (boosting ? 1.0 : 0);
  jetGroup.userData.flames.forEach(f => {
    f.scale.set(0.85 + Math.random() * 0.25, flen, 0.85 + Math.random() * 0.25);
  });
  fm.color.setHex(boosting ? 0xa8f0ff : 0x6fe0ff);
  fm.opacity = boosting ? 1 : 0.85;

  /* ---------- camera ---------- */
  const camDist = 22;
  const camHeight = 8;
  const camTarget = new THREE.Vector3(
    jet.pos.x + Math.sin(jet.yaw) * camDist,
    jet.pos.y + camHeight,
    jet.pos.z + Math.cos(jet.yaw) * camDist
  );

  if (state.shake > 0) {
    state.shake = Math.max(0, state.shake - dt * 55);
    const s = state.shake * 0.25;
    camTarget.x += rand(-s, s);
    camTarget.y += rand(-s, s);
    camTarget.z += rand(-s, s);
  }

  camera.position.lerp(camTarget, 1 - Math.exp(-8 * dt));

  // look target based on actual forward direction (yaw + pitch)
  const fwd = new THREE.Vector3(
    -Math.sin(jet.yaw) * Math.cos(jet.pitch),
    Math.sin(jet.pitch),
    -Math.cos(jet.yaw) * Math.cos(jet.pitch)
  );
  const lookAt = jet.pos.clone().addScaledVector(fwd, 30);
  lookAt.y += 3;
  camera.lookAt(lookAt);
  camera.rotateZ(jet.roll * 0.14);

  /* ---------- sky & sun follow ---------- */
  skyMesh.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(sunDir, 4200);

  /* ---------- water follows ---------- */
  water.position.x = jet.pos.x;
  water.position.z = jet.pos.z;

  /* ---------- clouds recycle ---------- */
  for (const c of clouds) {
    if (Math.abs(c.position.z - jet.pos.z) > 3800 ||
        Math.abs(c.position.x - jet.pos.x) > 3800) {
      c.position.set(
        jet.pos.x + rand(-3000, 3000),
        rand(650, 1600),
        jet.pos.z + rand(-3000, 3000)
      );
      c.scale.setScalar(rand(0.8, 2.0));
    }
  }

  /* ---------- explosion ---------- */
  updateExplosion(dt);

  /* ---------- village discovery ---------- */
  if (playing) {
    const ccx = Math.floor(jet.pos.x / CHUNK_SIZE);
    const ccz = Math.floor(jet.pos.z / CHUNK_SIZE);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        const key = (ccx+dx) + ',' + (ccz+dz);
        const data = chunkMeshes.get(key);
        if (!data || !data.villages) continue;
        for (const v of data.villages) {
          const vkey = Math.round(v.x) + ':' + Math.round(v.z);
          if (visitedVillages.has(vkey)) continue;
          const ddx = jet.pos.x - v.x;
          const ddz = jet.pos.z - v.z;
          if (ddx*ddx + ddz*ddz < 230*230) {
            visitedVillages.add(vkey);
            state.villagesFound++;
            state.multiplier = Math.min(8, state.multiplier + 1);
            state.score += 250 * state.multiplier;
          }
        }
      }
    }
  }

  /* ---------- world streaming ---------- */
  const budget = playing ? 2 : 4;
  updateChunks(jet.pos.x, jet.pos.z, budget);
}

/* =========================================================
   LOOP
   ========================================================= */
let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);

  update(dt);
  renderer.render(scene, camera);
  updateHUD(false);
}

/* =========================================================
   RESIZE
   ========================================================= */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
}
window.addEventListener('resize', onResize);

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  onResize();

  const th = Math.max(terrainHeight(0, 0), 0);
  jet.pos.set(0, th + 400, 0);

  // pre-build spawn chunks
  const order = [];
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++)
      order.push({ cx: dx, cz: dz, d: dx*dx + dz*dz });
  order.sort((a, b) => a.d - b.d);
  for (const { cx, cz } of order) {
    const key = cx + ',' + cz;
    if (!chunkMeshes.has(key)) {
      const data = buildChunk(cx, cz);
      chunkMeshes.set(key, data);
      scene.add(data.mesh);
    }
  }

  subtitle.innerHTML =
    `Open-world low-poly flight.<br>Explore. Discover villages. Don't crash.` +
    `<br><span style="font-size:11px;opacity:.8">BEST SCORE: <b style="color:#ffd35c">${state.best}</b></span>`;

  updateHUD(true);
  update(0.016);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

boot();
</script>
</body>
</html>
