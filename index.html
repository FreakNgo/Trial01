<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SKY RUNNER 3D — Low Poly Flight</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a1520;color:#e8f6ff;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
  .panel{position:absolute;padding:10px 16px 12px;border-radius:14px;
    background:rgba(8,22,40,.42);border:1px solid rgba(110,220,255,.28);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 10px 34px rgba(0,0,0,.45)}
  #pLeft{top:16px;left:16px}
  #pRight{top:16px;right:16px;text-align:right}
  .label{font-size:9px;letter-spacing:2.6px;color:#8ad4ee;font-weight:700}
  .value{font-size:27px;font-weight:800;line-height:1.05;color:#fff;
    text-shadow:0 0 16px rgba(110,220,255,.8);margin-top:2px;transition:transform .12s ease}
  .value.pop{transform:scale(1.14)}
  .value small{font-size:11px;font-weight:700;color:#8ad4ee;margin-left:3px;letter-spacing:1px}
  .sub{font-size:10px;color:#8ad4ee;letter-spacing:1.5px;margin-top:3px;font-weight:600}
  .lives{display:flex;gap:5px;margin-top:8px;justify-content:flex-end}
  .lives i{width:9px;height:9px;border-radius:2px;background:#ff5a7a;
    box-shadow:0 0 10px #ff5a7a;display:block;transition:.25s}
  .lives i.off{background:rgba(255,255,255,.13);box-shadow:none}

  #boostBox{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    width:260px;max-width:62vw;text-align:center}
  #boostLabel{font-size:9px;letter-spacing:3.2px;color:#8ad4ee;font-weight:700;margin-bottom:6px}
  #boostWrap{height:9px;border-radius:99px;background:rgba(8,22,40,.75);
    border:1px solid rgba(110,220,255,.32);overflow:hidden}
  #boostBar{height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#4fe3ff,#a06bff);
    box-shadow:0 0 16px rgba(110,220,255,.9);transition:width .08s linear}

  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center,rgba(255,40,60,0) 40%,rgba(255,40,60,.55) 100%);
    opacity:0;transition:opacity .18s ease}

  /* ---------- Overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:16px;padding:28px;
    background:radial-gradient(ellipse at 50% 42%,rgba(8,26,48,.62),rgba(3,8,16,.94));
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    transition:opacity .4s ease}
  #overlay.hide{opacity:0;pointer-events:none}
  h1{font-size:clamp(32px,8.5vw,68px);letter-spacing:.11em;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#ffffff 22%,#4fe3ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(79,227,255,.6))}
  #subtitle{font-size:clamp(12px,3vw,15px);color:#a9cfe2;letter-spacing:.1em;
    max-width:540px;line-height:1.8;font-weight:600}
  button{pointer-events:auto;cursor:pointer;border:none;padding:15px 46px;border-radius:99px;
    font-family:inherit;font-size:15px;font-weight:800;letter-spacing:.18em;color:#04121d;
    background:linear-gradient(180deg,#9af3ff,#33c6ff);
    box-shadow:0 0 36px rgba(79,227,255,.55),0 10px 26px rgba(0,0,0,.45);
    transition:transform .12s ease,box-shadow .12s ease}
  button:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 56px rgba(79,227,255,.9)}
  button:active{transform:scale(.97)}
  .hint{font-size:11px;color:#87aec2;letter-spacing:.06em;line-height:2.2;max-width:580px}
  kbd{background:rgba(79,227,255,.12);border:1px solid rgba(79,227,255,.36);
    border-radius:6px;padding:2px 7px;font-family:inherit;font-size:10px;
    color:#c7f1ff;font-weight:700;margin:0 1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="panel" id="pLeft">
    <div class="label">SCORE</div>
    <div class="value" id="scoreEl">0</div>
    <div class="sub">BEST <span id="bestEl">0</span></div>
  </div>
  <div class="panel" id="pRight">
    <div class="label">SPEED</div>
    <div class="value"><span id="speedEl">0</span><small>KM/H</small></div>
    <div class="sub">ALT <span id="altEl">0</span> M</div>
    <div class="lives" id="livesEl"></div>
  </div>
  <div id="boostBox">
    <div id="boostLabel">BOOST</div>
    <div id="boostWrap"><div id="boostBar"></div></div>
  </div>
</div>

<div id="overlay">
  <h1 id="title">SKY RUNNER</h1>
  <p id="subtitle">Open-world low-poly flight.<br>Fly through the gates. Explore the valleys.</p>
  <button id="startBtn">START FLIGHT</button>
  <p class="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> to steer
    &nbsp;·&nbsp; <kbd>Shift</kbd> to boost<br>
    On touch devices: drag anywhere on screen to fly
  </p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   SMALL UTILITIES
   ========================================================= */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function chunkSeed(cx, cz) {
  let h = Math.imul(cx, 374761393) + Math.imul(cz, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

/* =========================================================
   HASH / VALUE NOISE / FBM
   ========================================================= */
function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}

function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi);
  const b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1);
  const d = hash2(xi + 1, yi + 1);
  const ab = a + (b - a) * u;
  const cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}

function fbm(x, y, oct) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * freq, y * freq);
    norm += amp;
    amp *= 0.5;
    freq *= 2.0;
  }
  return sum / norm;
}

/* =========================================================
   TERRAIN HEIGHT FIELD  (mountains + lake basins)
   ========================================================= */
function terrainHeight(x, z) {
  // rolling base
  const base = fbm(x * 0.0016, z * 0.0016, 5);
  let h = (base - 0.45) * 340;

  // lake basins — carve flat depressions below water level
  const lake = fbm(x * 0.00075 + 137.3, z * 0.00075 + 91.7, 3);
  if (lake < 0.44) {
    const t = Math.min(1, (0.44 - lake) / 0.16);
    h = h * (1 - t) - 58 * t;
  }

  // mountain ranges
  const mn = fbm(x * 0.00055 + 512.1, z * 0.00055 + 733.9, 4);
  let mask = (mn - 0.53) / 0.47;
  if (mask > 0) {
    mask = Math.min(1, mask);
    const ridge = fbm(x * 0.0034 + 77.7, z * 0.0034 + 21.3, 4);
    h += mask * mask * (650 + 950 * ridge * ridge);
  }
  return h;
}

/* =========================================================
   TERRAIN PALETTE
   ========================================================= */
const C_MUD    = new THREE.Color(0x3e5a4a);
const C_SAND   = new THREE.Color(0xd9c98d);
const C_GRASS1 = new THREE.Color(0x74bd4e);
const C_GRASS2 = new THREE.Color(0x4f9539);
const C_FOREST = new THREE.Color(0x36702d);
const C_ROCK   = new THREE.Color(0x7a7166);
const C_ROCK2  = new THREE.Color(0x585250);
const C_SNOW   = new THREE.Color(0xeef5ff);

function pickColor(y, ny, out) {
  if (y < -2)          out.copy(C_MUD);
  else if (y < 4)      out.copy(C_SAND);
  else if (ny < 0.62)  out.copy(C_ROCK);
  else if (y < 170)    out.copy(C_GRASS1).lerp(C_GRASS2, (y - 4) / 166);
  else if (y < 340)    out.copy(C_GRASS2).lerp(C_FOREST, (y - 170) / 170);
  else if (y < 520)    out.copy(C_FOREST).lerp(C_ROCK,   (y - 340) / 180);
  else if (y < 700)    out.copy(C_ROCK).lerp(C_ROCK2,    (y - 520) / 180);
  else                 out.copy(C_SNOW);
  const v = 0.93 + Math.random() * 0.14;
  out.r *= v; out.g *= v; out.b *= v;
}

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;

const scene  = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xbcdcf2);
scene.fog = new THREE.Fog(FOG_COLOR, 950, 2900);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.6, 9000);
camera.position.set(0, 300, 20);

/* ---------- Sky dome ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x1e5da8) },
    midColor: { value: new THREE.Color(0xbcdcf2) },
    botColor: { value: new THREE.Color(0x8fb8d8) },
    exponent: { value: 0.72 }
  },
  vertexShader: `
    varying vec3 vW;
    void main(){
      vec4 wp = modelMatrix * vec4(position,1.0);
      vW = wp.xyz - cameraPosition;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 topColor, midColor, botColor;
    uniform float exponent;
    varying vec3 vW;
    void main(){
      float h = normalize(vW).y;
      vec3 c;
      if (h > 0.0) c = mix(midColor, topColor, pow(h, exponent));
      else         c = mix(midColor, botColor, pow(-h, 0.55));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(6000, 24, 16), skyMat);
skyMesh.renderOrder = -1000;
skyMesh.frustumCulled = false;
scene.add(skyMesh);

/* ---------- Lights ---------- */
const sunDir = new THREE.Vector3(0.35, 0.58, 0.74).normalize();

const hemi = new THREE.HemisphereLight(0xcfe9ff, 0x46603a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 1.45);
sun.position.copy(sunDir).multiplyScalar(1500);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9dc4ff, 0.35);
fill.position.set(-0.5, 0.3, -0.8).multiplyScalar(1000);
scene.add(fill);

/* ---------- Sun glow sprite ---------- */
function makeGlowTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0,    'rgba(255,255,245,1)');
  grd.addColorStop(0.13, 'rgba(255,248,205,0.92)');
  grd.addColorStop(0.36, 'rgba(255,208,130,0.34)');
  grd.addColorStop(1,    'rgba(255,160,60,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(cv);
}
const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  transparent: true
}));
sunSprite.scale.setScalar(2200);
sunSprite.renderOrder = -900;
scene.add(sunSprite);

/* =========================================================
   WATER PLANE
   ========================================================= */
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x2c7fb8,
  specular: 0xbfe8ff,
  shininess: 110,
  transparent: true,
  opacity: 0.86,
  flatShading: true
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(26000, 26000, 1, 1), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
water.renderOrder = 1;
scene.add(water);

/* =========================================================
   GEOMETRY HELPERS
   ========================================================= */
const _tmpColor = new THREE.Color();

function setColor(geo, hex, variance, rng) {
  _tmpColor.set(hex);
  const v = 1 + (rng() - 0.5) * variance * 2;
  const r = _tmpColor.r * v;
  const g = _tmpColor.g * v;
  const b = _tmpColor.b * v;
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    arr[i * 3] = r;
    arr[i * 3 + 1] = g;
    arr[i * 3 + 2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}

function mergeGeos(geos) {
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  const col = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}

/* =========================================================
   CHUNK BUILDING
   ========================================================= */
const CHUNK_SIZE = 520;
const CHUNK_SEG  = 14;
const VIEW_R     = 4;

const chunkMat = new THREE.MeshLambertMaterial({
  vertexColors: true,
  flatShading: true
});

const chunkMeshes = new Map();

function addHouse(geos, x, y, z, rot, rng) {
  const w  = 7 + rng() * 4;
  const d  = 8 + rng() * 4;
  const hh = 6 + rng() * 4;

  const wallCol = [0xe8dcc0, 0xdfc9a8, 0xf0e4c8, 0xd8cdb4][Math.floor(rng() * 4)];
  const roofCol = [0xa8453a, 0x8f4a3a, 0x6e4a3a, 0xb5503f][Math.floor(rng() * 4)];

  const body = new THREE.BoxGeometry(w, hh, d).toNonIndexed();
  setColor(body, wallCol, 0.055, rng);
  body.translate(0, hh / 2, 0);

  const roof = new THREE.ConeGeometry(Math.max(w, d) * 0.76, hh * 0.72, 4).toNonIndexed();
  setColor(roof, roofCol, 0.06, rng);
  roof.rotateY(Math.PI / 4);
  roof.translate(0, hh + hh * 0.36, 0);

  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rot),
    new THREE.Vector3(1, 1, 1)
  );
  body.applyMatrix4(m);
  roof.applyMatrix4(m);
  geos.push(body, roof);
}

function buildProps(cx, cz, geos) {
  const rng = mulberry32(chunkSeed(cx, cz));
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;

  /* ---- trees ---- */
  const treeCount = 8 + Math.floor(rng() * 13);
  for (let i = 0; i < treeCount; i++) {
    const x = ox + (rng() - 0.5) * CHUNK_SIZE * 0.95;
    const z = oz + (rng() - 0.5) * CHUNK_SIZE * 0.95;
    const h = terrainHeight(x, z);
    if (h < 5 || h > 330) continue;

    const dx = terrainHeight(x + 16, z) - terrainHeight(x - 16, z);
    const dz = terrainHeight(x, z + 16) - terrainHeight(x, z - 16);
    if (Math.hypot(dx, dz) / 32 > 0.85) continue;

    const s = 0.75 + rng() * 0.9;
    const trunkH = 4 * s;

    const trunk = new THREE.BoxGeometry(1.3 * s, trunkH, 1.3 * s).toNonIndexed();
    setColor(trunk, 0x5a4530, 0.14, rng);
    trunk.translate(x, h + trunkH / 2, z);

    const leafH = 12 * s;
    const leaf = new THREE.ConeGeometry(4.2 * s, leafH, 5).toNonIndexed();
    setColor(leaf, 0x2f7a3a, 0.18, rng);
    leaf.translate(x, h + trunkH + leafH / 2 - 1, z);

    geos.push(trunk, leaf);
  }

  /* ---- villages ---- */
  if (rng() < 0.36) {
    const vx = ox + (rng() - 0.5) * CHUNK_SIZE * 0.55;
    const vz = oz + (rng() - 0.5) * CHUNK_SIZE * 0.55;
    const vh = terrainHeight(vx, vz);

    let maxD = 0;
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * Math.PI * 2;
      const px = vx + Math.cos(ang) * 70;
      const pz = vz + Math.sin(ang) * 70;
      maxD = Math.max(maxD, Math.abs(terrainHeight(px, pz) - vh));
    }

    if (vh > 6 && vh < 300 && maxD < 26) {
      const n = 4 + Math.floor(rng() * 5);
      for (let i = 0; i < n; i++) {
        const ang = rng() * Math.PI * 2;
        const rad = 14 + rng() * 72;
        const hx = vx + Math.cos(ang) * rad;
        const hz = vz + Math.sin(ang) * rad;
        const hh = terrainHeight(hx, hz);
        if (hh < 3) continue;
        addHouse(geos, hx, hh, hz, rng() * Math.PI * 2, rng);
      }
    }
  }
}

function buildChunk(cx, cz) {
  const geos = [];

  /* ---------- terrain mesh ---------- */
  const size = CHUNK_SIZE, seg = CHUNK_SEG;
  const tg = new THREE.PlaneGeometry(size, size, seg, seg);
  tg.rotateX(-Math.PI / 2);
  tg.translate(cx * size, 0, cz * size);

  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    tp.setY(i, terrainHeight(tp.getX(i), tp.getZ(i)));
  }

  const terrain = tg.toNonIndexed();
  tg.dispose();

  /* ---------- per-face vertex colors ---------- */
  const tpos = terrain.attributes.position;
  const cnt = tpos.count;
  const colors = new Float32Array(cnt * 3);
  const col = new THREE.Color();

  for (let f = 0; f < cnt; f += 3) {
    const ax = tpos.getX(f),     ay = tpos.getY(f),     az = tpos.getZ(f);
    const bx = tpos.getX(f + 1), by = tpos.getY(f + 1), bz = tpos.getZ(f + 1);
    const cx2 = tpos.getX(f + 2), cy2 = tpos.getY(f + 2), cz2 = tpos.getZ(f + 2);

    const avgY = (ay + by + cy2) / 3;

    const e1x = bx - ax,   e1y = by - ay,   e1z = bz - az;
    const e2x = cx2 - ax,  e2y = cy2 - ay,  e2z = cz2 - az;
    let nx = e1y * e2z - e1z * e2y;
    let ny = e1z * e2x - e1x * e2z;
    let nz = e1x * e2y - e1y * e2x;
    const len = Math.hypot(nx, ny, nz) || 1;
    ny = Math.abs(ny / len);

    pickColor(avgY, ny, col);

    for (let k = 0; k < 3; k++) {
      colors[(f + k) * 3]     = col.r;
      colors[(f + k) * 3 + 1] = col.g;
      colors[(f + k) * 3 + 2] = col.b;
    }
  }
  terrain.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geos.push(terrain);

  /* ---------- props ---------- */
  buildProps(cx, cz, geos);

  const merged = mergeGeos(geos);
  merged.computeBoundingSphere();

  const mesh = new THREE.Mesh(merged, chunkMat);
  mesh.frustumCulled = true;
  return mesh;
}

/* =========================================================
   CHUNK STREAMING
   ========================================================= */
function updateChunks(px, pz, budget) {
  const ccx = Math.floor(px / CHUNK_SIZE);
  const ccz = Math.floor(pz / CHUNK_SIZE);

  // remove out-of-range chunks
  for (const [key, mesh] of chunkMeshes) {
    const comma = key.indexOf(',');
    const cx = +key.slice(0, comma);
    const cz = +key.slice(comma + 1);
    if (Math.abs(cx - ccx) > VIEW_R + 1 || Math.abs(cz - ccz) > VIEW_R + 1) {
      scene.remove(mesh);
      mesh.geometry.dispose();
      chunkMeshes.delete(key);
    }
  }

  // gather missing chunks sorted by distance
  const missing = [];
  const R = VIEW_R + 0.5;
  for (let dx = -VIEW_R; dx <= VIEW_R; dx++) {
    for (let dz = -VIEW_R; dz <= VIEW_R; dz++) {
      if (dx * dx + dz * dz > R * R) continue;
      const cx = ccx + dx, cz = ccz + dz;
      const key = cx + ',' + cz;
      if (!chunkMeshes.has(key)) missing.push({ cx, cz, d: dx * dx + dz * dz });
    }
  }
  missing.sort((a, b) => a.d - b.d);

  const n = Math.min(budget, missing.length);
  for (let i = 0; i < n; i++) {
    const { cx, cz } = missing[i];
    const key = cx + ',' + cz;
    if (chunkMeshes.has(key)) continue;
    const mesh = buildChunk(cx, cz);
    chunkMeshes.set(key, mesh);
    scene.add(mesh);
  }
}

/* =========================================================
   JET MODEL
   ========================================================= */
function createJet() {
  const g = new THREE.Group();
  const D = THREE.DoubleSide;

  const bodyMat  = new THREE.MeshLambertMaterial({ color: 0xdfe8f2, flatShading: true, side: D });
  const darkMat  = new THREE.MeshLambertMaterial({ color: 0x39424f, flatShading: true, side: D });
  const redMat   = new THREE.MeshLambertMaterial({ color: 0xe2453f, flatShading: true, side: D });
  const glassMat = new THREE.MeshLambertMaterial({
    color: 0x2ab8ff, flatShading: true, emissive: 0x0a2d44, side: D
  });

  /* --- fuselage --- */
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 1.1, 7.4, 7), bodyMat);
  fus.rotation.x = Math.PI / 2;
  g.add(fus);

  /* --- nose --- */
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.82, 3.0, 7), bodyMat);
  nose.rotation.x = -Math.PI / 2;
  nose.position.z = -5.2;
  g.add(nose);

  /* --- cockpit --- */
  const cock = new THREE.Mesh(new THREE.SphereGeometry(0.72, 7, 5), glassMat);
  cock.scale.set(1, 0.86, 1.9);
  cock.position.set(0, 0.6, -1.5);
  g.add(cock);

  /* --- wings (swept, low poly) --- */
  function makeWing(sign) {
    const s = new THREE.Shape();
    s.moveTo(0, 1.7);
    s.lineTo(sign * 5.6, 1.0);
    s.lineTo(sign * 5.6, -0.9);
    s.lineTo(0, -1.5);
    s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: 0.22, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, -0.11, 0);
    return new THREE.Mesh(geo, bodyMat);
  }
  g.add(makeWing(1), makeWing(-1));

  /* --- wingtip accents --- */
  [-5.6, 5.6].forEach(x => {
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 2.0), redMat);
    tip.position.set(x, 0.05, 0.05);
    g.add(tip);
  });

  /* --- tail fin --- */
  const fs = new THREE.Shape();
  fs.moveTo(0, 0);
  fs.lineTo(1.9, 0);
  fs.lineTo(1.45, 2.5);
  fs.lineTo(0.45, 2.5);
  fs.closePath();
  const finGeo = new THREE.ExtrudeGeometry(fs, { depth: 0.18, bevelEnabled: false });
  finGeo.rotateY(-Math.PI / 2);
  finGeo.translate(-0.09, 0.4, 1.55);
  g.add(new THREE.Mesh(finGeo, redMat));

  /* --- horizontal stabilizers --- */
  [1, -1].forEach(sgn => {
    const st = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.16, 1.1), bodyMat);
    st.position.set(sgn * 1.55, 0, 2.75);
    g.add(st);
  });

  /* --- engines --- */
  [-0.95, 0.95].forEach(x => {
    const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.54, 2.4, 7), darkMat);
    eng.rotation.x = Math.PI / 2;
    eng.position.set(x, -0.08, 2.25);
    g.add(eng);
  });

  /* --- exhaust flames --- */
  const flameMat = new THREE.MeshBasicMaterial({
    color: 0x6fe0ff,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const flames = [];
  [-0.95, 0.95].forEach(x => {
    const f = new THREE.Mesh(new THREE.ConeGeometry(0.44, 2.6, 7), flameMat);
    f.rotation.x = Math.PI / 2;
    f.position.set(x, -0.08, 4.0);
    g.add(f);
    flames.push(f);
  });

  g.userData.flames = flames;
  g.userData.flameMat = flameMat;
  return g;
}

const jetGroup = createJet();
jetGroup.rotation.order = 'YXZ';
scene.add(jetGroup);

/* =========================================================
   RINGS (gates)
   ========================================================= */
const RING_COUNT = 12;
const ringGeo = new THREE.TorusGeometry(30, 3.4, 5, 12);

const ringMatNormal = new THREE.MeshLambertMaterial({
  color: 0x7fe8ff, emissive: 0x1c7ea8, flatShading: true
});
const ringMatNext = new THREE.MeshLambertMaterial({
  color: 0xffd35c, emissive: 0xa86a10, flatShading: true
});

const rings = [];
let ringFrontZ = 0;

function makeRing() {
  const mesh = new THREE.Mesh(ringGeo, ringMatNormal);
  scene.add(mesh);
  return { mesh, x: 0, y: 0, z: 0, flash: 0, radius: 30 };
}

function placeRing(r, z, fromJet) {
  r.z = z;
  const nx = fromJet.x + rand(-650, 650);
  const th = terrainHeight(nx, z);
  let ny = fromJet.y + rand(-180, 180);
  ny = clamp(ny, fromJet.y - 350, fromJet.y + 350);
  ny = Math.max(ny, th + 110);
  ny = Math.min(ny, 1650);
  r.x = nx;
  r.y = ny;
  r.flash = 0;
  r.mesh.position.set(r.x, r.y, r.z);
  r.mesh.rotation.set(0, 0, 0);
  r.mesh.scale.setScalar(1);
}

function initRings() {
  rings.length = 0;
  ringFrontZ = jet.pos.z - 750;
  for (let i = 0; i < RING_COUNT; i++) {
    const r = makeRing();
    placeRing(r, ringFrontZ, jet.pos);
    ringFrontZ -= rand(360, 520);
    rings.push(r);
  }
}

/* =========================================================
   CLOUDS
   ========================================================= */
const cloudMat = new THREE.MeshLambertMaterial({
  color: 0xffffff,
  flatShading: true,
  transparent: true,
  opacity: 0.92
});

function createCloudGeo() {
  const geos = [];
  const n = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const s = 40 + Math.random() * 55;
    const g = new THREE.IcosahedronGeometry(s, 0);
    g.translate(
      (Math.random() - 0.5) * 150,
      (Math.random() - 0.5) * 45,
      (Math.random() - 0.5) * 110
    );
    geos.push(g);
  }
  // merge (positions only, no color needed)
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3);
  let off = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, off * 3);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.computeVertexNormals();
  return out;
}

const clouds = [];
for (let i = 0; i < 34; i++) {
  const m = new THREE.Mesh(createCloudGeo(), cloudMat);
  m.position.set(rand(-3200, 3200), rand(650, 1500), rand(-3200, 3200));
  m.scale.setScalar(rand(0.8, 2.0));
  scene.add(m);
  clouds.push(m);
}

/* =========================================================
   GAME STATE
   ========================================================= */
const jet = {
  pos: new THREE.Vector3(0, 300, 0),
  vx: 0,
  vy: 0,
  speed: 320,
  boost: 100,
  lives: 3,
  maxLives: 5,
  invuln: 0,
  roll: 0,
  pitch: 0
};

const state = {
  phase: 'menu',     // 'menu' | 'play' | 'over'
  score: 0,
  best: Number(localStorage.getItem('skyrunner3d_best') || 0),
  travel: 0,
  prevZ: 0,
  passed: 0,
  combo: 1,
  comboTimer: 0,
  shake: 0,
  flashT: 0
};

const keys = Object.create(null);
const pointer = { down: false, x: 0, y: 0 };

/* =========================================================
   DOM REFS
   ========================================================= */
const scoreEl  = document.getElementById('scoreEl');
const bestEl   = document.getElementById('bestEl');
const speedEl  = document.getElementById('speedEl');
const altEl    = document.getElementById('altEl');
const livesEl  = document.getElementById('livesEl');
const boostBar = document.getElementById('boostBar');
const overlay  = document.getElementById('overlay');
const title    = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const startBtn = document.getElementById('startBtn');
const flashEl  = document.getElementById('flash');

let lastScore = -1, lastSpeed = -1, lastAlt = -1, lastBoost = -1, lastLives = -1, lastBest = -1;

function updateHUD(force) {
  if (state.score !== lastScore || force) {
    scoreEl.textContent = state.score;
    lastScore = state.score;
  }
  if (state.best !== lastBest || force) {
    bestEl.textContent = state.best;
    lastBest = state.best;
  }
  const spd = Math.round(jet.speed * 1.9);
  if (spd !== lastSpeed || force) {
    speedEl.textContent = spd;
    lastSpeed = spd;
  }
  const alt = Math.max(0, Math.round(jet.pos.y));
  if (alt !== lastAlt || force) {
    altEl.textContent = alt;
    lastAlt = alt;
  }
  const b = Math.round(jet.boost);
  if (b !== lastBoost || force) {
    boostBar.style.width = b + '%';
    lastBoost = b;
  }
  if (jet.lives !== lastLives || force) {
    let html = '';
    for (let i = 0; i < jet.maxLives; i++) {
      html += '<i class="' + (i < jet.lives ? '' : 'off') + '"></i>';
    }
    livesEl.innerHTML = html;
    lastLives = jet.lives;
  }
}

function popScore() {
  scoreEl.classList.add('pop');
  setTimeout(() => scoreEl.classList.remove('pop'), 130);
}

/* =========================================================
   INPUT
   ========================================================= */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if ((k === ' ' || k === 'enter') && state.phase !== 'play') startGame();
}, { passive: false });

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  pointer.down = false;
});

canvas.addEventListener('pointerdown', e => {
  pointer.down = true;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  if (canvas.setPointerCapture) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointer.down) return;
  pointer.x = e.clientX;
  pointer.y = e.clientY;
});
canvas.addEventListener('pointerup',     () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
canvas.addEventListener('pointerleave',  () => { pointer.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

startBtn.addEventListener('click', startGame);

/* =========================================================
   GAME FLOW
   ========================================================= */
function startGame() {
  state.phase = 'play';
  state.score = 0;
  state.travel = 0;
  state.passed = 0;
  state.combo = 1;
  state.comboTimer = 0;
  state.shake = 0;

  jet.pos.set(0, Math.max(terrainHeight(0, 0), 0) + 320, 0);
  jet.vx = 0; jet.vy = 0;
  jet.speed = 320;
  jet.boost = 100;
  jet.lives = 3;
  jet.invuln = 1.5;

  state.prevZ = jet.pos.z;

  // teleport existing rings ahead of the new position
  ringFrontZ = jet.pos.z - 750;
  for (const r of rings) {
    placeRing(r, ringFrontZ, jet.pos);
    ringFrontZ -= rand(360, 520);
  }

  overlay.classList.add('hide');
  updateHUD(true);
}

function gameOver() {
  state.phase = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    try { localStorage.setItem('skyrunner3d_best', String(state.best)); } catch (e) {}
  }
  title.textContent = 'FLIGHT OVER';
  subtitle.innerHTML =
    `SCORE <b style="color:#4fe3ff">${state.score}</b>` +
    ` &nbsp;·&nbsp; BEST <b style="color:#ffd35c">${state.best}</b>` +
    `<br><span style="font-size:11px;opacity:.75">Distance flown: ${(state.travel / 1000).toFixed(2)} km &nbsp;·&nbsp; Gates passed: ${state.passed}</span>`;
  startBtn.textContent = 'FLY AGAIN';
  overlay.classList.remove('hide');
  updateHUD(true);
}

function crash() {
  if (jet.invuln > 0) return;
  jet.lives--;
  jet.invuln = 1.6;
  state.shake = 26;
  state.flashT = 1;
  state.combo = 1;

  flashEl.style.opacity = '1';
  setTimeout(() => { flashEl.style.opacity = '0'; }, 190);

  // bounce back up
  const th = Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0);
  jet.pos.y = th + 130;
  jet.vy = 60;
  jet.speed *= 0.55;

  if (jet.lives <= 0) gameOver();
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
  const playing = state.phase === 'play';

  /* ---------- input vector ---------- */
  let ix = 0, iy = 0;
  if (playing) {
    if (keys['a'] || keys['arrowleft'])  ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup'])    iy += 1;
    if (keys['s'] || keys['arrowdown'])  iy -= 1;

    if (pointer.down) {
      const px = (pointer.x - window.innerWidth / 2) / (window.innerWidth / 2);
      const py = (pointer.y - window.innerHeight / 2) / (window.innerHeight / 2);
      if (Math.abs(px) > 0.08) ix += clamp(px, -1, 1);
      if (Math.abs(py) > 0.08) iy -= clamp(py, -1, 1);
    }
  }

  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  /* ---------- speed & boost ---------- */
  const boosting = playing && !!keys['shift'] && jet.boost > 0.5;
  const diffFactor = Math.min(1, state.travel / 120000);
  const targetSpeed = (320 + 170 * diffFactor) * (boosting ? 1.6 : 1);

  jet.speed += (targetSpeed - jet.speed) * (1 - Math.exp(-3.2 * dt));

  if (boosting) jet.boost = Math.max(0, jet.boost - 24 * dt);
  else          jet.boost = Math.min(100, jet.boost + 13 * dt);

  /* ---------- steering (arcade) ---------- */
  const targetVX = ix * 210;
  const targetVY = iy * 155;
  const k = 1 - Math.exp(-7.5 * dt);
  jet.vx += (targetVX - jet.vx) * k;
  jet.vy += (targetVY - jet.vy) * k;

  if (playing) {
    jet.pos.x += jet.vx * dt;
    jet.pos.y += jet.vy * dt;
    jet.pos.z -= jet.speed * dt;

    state.travel += jet.speed * dt;
    state.score += Math.floor(jet.speed * dt * 0.055);
  } else {
    // gentle autopilot cruise in menu / game over
    jet.pos.z -= 240 * dt;
    jet.pos.x += (Math.sin(performance.now() * 0.00013) * 200 - jet.pos.x) * (1 - Math.exp(-1.2 * dt));
    jet.pos.y += (Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0) + 380 - jet.pos.y) * (1 - Math.exp(-1.2 * dt));
    jet.vx = 0; jet.vy = 0;
    state.travel += 240 * dt;
  }

  /* ---------- altitude limits ---------- */
  const ceiling = 2400;
  if (jet.pos.y > ceiling) { jet.pos.y = ceiling; jet.vy = Math.min(jet.vy, 0); }

  /* ---------- ground / water collision ---------- */
  if (playing) {
    if (jet.invuln > 0) jet.invuln -= dt;
    const th = Math.max(terrainHeight(jet.pos.x, jet.pos.z), 0);
    if (jet.pos.y < th + 16) {
      crash();
    }
  }

  /* ---------- jet visuals ---------- */
  const targetRoll  = clamp(-jet.vx / 210, -1, 1) * 0.62;
  const targetPitch = clamp( jet.vy / 155, -1, 1) * 0.34;
  const lerp = 1 - Math.exp(-9 * dt);
  jet.roll  += (targetRoll  - jet.roll)  * lerp;
  jet.pitch += (targetPitch - jet.pitch) * lerp;

  jetGroup.position.copy(jet.pos);
  jetGroup.rotation.set(jet.pitch, clamp(-jet.vx / 210, -1, 1) * -0.32, jet.roll);

  // flame flicker
  const fm = jetGroup.userData.flameMat;
  const flen = 0.75 + Math.random() * 0.35 + (boosting ? 0.9 : 0);
  jetGroup.userData.flames.forEach((f, i) => {
    f.scale.set(0.85 + Math.random() * 0.25, flen, 0.85 + Math.random() * 0.25);
  });
  fm.color.setHex(boosting ? 0xa8f0ff : 0x6fe0ff);
  fm.opacity = boosting ? 1 : 0.85;

  /* ---------- camera ---------- */
  const camTarget = new THREE.Vector3(
    jet.pos.x - jet.vx * 0.035,
    jet.pos.y + 7.5 + jet.vy * 0.02,
    jet.pos.z + 19
  );

  if (state.shake > 0) {
    state.shake = Math.max(0, state.shake - dt * 55);
    const s = state.shake * 0.22;
    camTarget.x += rand(-s, s);
    camTarget.y += rand(-s, s);
  }

  camera.position.lerp(camTarget, 1 - Math.exp(-9 * dt));

  const lookTarget = new THREE.Vector3(
    jet.pos.x - jet.vx * 0.12,
    jet.pos.y + 1.6,
    jet.pos.z - 22
  );
  camera.lookAt(lookTarget);
  camera.rotateZ(jet.roll * 0.22);

  /* ---------- sky / sun follow camera ---------- */
  skyMesh.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(sunDir, 4200);

  /* ---------- water follows ---------- */
  water.position.x = jet.pos.x;
  water.position.z = jet.pos.z;

  /* ---------- clouds recycle ---------- */
  for (const c of clouds) {
    if (Math.abs(c.position.z - jet.pos.z) > 3800 ||
        Math.abs(c.position.x - jet.pos.x) > 3800) {
      c.position.set(
        jet.pos.x + rand(-3000, 3000),
        rand(650, 1600),
        jet.pos.z + rand(-3000, 3000)
      );
      c.scale.setScalar(rand(0.8, 2.0));
    }
  }

  /* ---------- rings ---------- */
  const prevZ = state.prevZ;
  state.prevZ = jet.pos.z;

  let nextRing = null;

  for (const r of rings) {
    r.mesh.position.z = r.z;

    // pulse
    const pulse = 1 + Math.sin(performance.now() * 0.004 + r.z * 0.01) * 0.03;
    r.mesh.scale.setScalar(pulse);

    if (r.flash > 0) {
      r.flash -= dt * 2.5;
      const s = 1 + (1 - r.flash) * 0.6;
      r.mesh.scale.setScalar(s);
      r.mesh.rotation.z += dt * 4;
    }

    // crossing test
    if (playing && prevZ > r.z && jet.pos.z <= r.z) {
      const d = Math.hypot(jet.pos.x - r.x, jet.pos.y - r.y);
      if (d < r.radius * 1.05) {
        const perfect = d < r.radius * 0.42;
        const gain = Math.round((perfect ? 260 : 120) * state.combo);
        state.score += gain;
        state.passed++;
        state.combo = Math.min(8, state.combo + 1);
        state.comboTimer = 3.5;
        r.flash = 1;
        popScore();
      } else {
        state.combo = 1;
      }
    }

    // recycle behind the jet
    if (r.z > jet.pos.z + 200) {
      ringFrontZ -= rand(360, 540);
      placeRing(r, ringFrontZ, jet.pos);
    }

    // find next ring
    if (r.z < jet.pos.z && (!nextRing || r.z > nextRing.z)) nextRing = r;
  }

  // combo decay
  if (state.combo > 1) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 1;
  }

  // highlight next ring
  for (const r of rings) {
    const mat = (r === nextRing) ? ringMatNext : ringMatNormal;
    if (r.mesh.material !== mat) r.mesh.material = mat;
  }

  /* ---------- world streaming ---------- */
  const budget = playing ? 2 : 4;
  updateChunks(jet.pos.x, jet.pos.z, budget);
}

/* =========================================================
   RENDER LOOP
   ========================================================= */
let lastTime = performance.now();

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt <= 0) dt = 0.016;
  dt = Math.min(dt, 0.05);

  update(dt);
  renderer.render(scene, camera);
  updateHUD(false);
}

/* =========================================================
   RESIZE
   ========================================================= */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
}
window.addEventListener('resize', onResize);

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  onResize();

  // spawn above terrain
  jet.pos.set(0, Math.max(terrainHeight(0, 0), 0) + 320, 0);
  state.prevZ = jet.pos.z;

  // build the immediate 3x3 area before showing anything
  const ccx = 0, ccz = 0;
  const order = [];
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++)
      order.push({ cx: ccx + dx, cz: ccz + dz, d: dx * dx + dz * dz });
  order.sort((a, b) => a.d - b.d);

  for (const { cx, cz } of order) {
    const key = cx + ',' + cz;
    if (!chunkMeshes.has(key)) {
      const m = buildChunk(cx, cz);
      chunkMeshes.set(key, m);
      scene.add(m);
    }
  }

  initRings();

  subtitle.innerHTML =
    `Open-world low-poly flight.<br>Fly through the gates. Explore the valleys.` +
    `<br><span style="font-size:11px;opacity:.8">BEST SCORE: <b style="color:#ffd35c">${state.best}</b></span>`;

  updateHUD(true);
  update(0.016);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

boot();
</script>
